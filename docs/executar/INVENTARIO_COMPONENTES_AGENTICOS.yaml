# INVENTARIO_COMPONENTES_AGENTICOS.yaml
# Fase 0 — Auditoria e reconciliação. Gerado por inspeção direta do
# código em claude/lucid-galileo-3jnpad (= PR #1 + HANDOFF.md + plano),
# não por recordação do handoff. Cada item cita o(s) arquivo(s) fonte.
# Escada de maturidade aplicada por item: documentado / implementado /
# testado / verificado / deployed / released — nunca "verificado" sem
# evidência de execução real nesta sessão.

id: INVENTARIO-COMPONENTES-AGENTICOS-001
gerado_em: "2026-09-11"
branch_auditada: claude/lucid-galileo-3jnpad
commit_auditado: 20a47f4
observacao_metodologica: >
  O corpus original (Executar-app-Blueprint: 02_BACKLOG_REQUISITOS_CANDIDATOS.yaml,
  NOTAS_AGENT_SDK.md, schema_bundle.yaml, PRD-MCP.md etc.) não está clonado
  nesta sessão nem em next-forge — é um repositório separado (AGENTS.md:
  "Executar-app-Blueprint ... READ / REQUIREMENTS / SOT"), fora do escopo
  GitHub desta sessão. Este inventário usa como fonte de requisitos o que
  PLANO_EXECUTAR_COPILOTO.md já extraiu desse corpus (citado com "fonte:
  plano, não corpus direto") mais inspeção direta do código real. Onde o
  plano e o código divergem, ambos são citados.

runtime_agentico:
  sdk_em_uso:
    pacote: "ai@^6.0.116 (Vercel AI SDK)"
    evidencia: packages/agent-runtime/package.json
    claude_agent_sdk_presente: false
    evidencia_ausencia: >
      grep recursivo por "claude-agent-sdk"/"@anthropic-ai/claude-agent-sdk"
      em *.json/*.ts/*.tsx no repo inteiro: zero ocorrências.
    decisao_aplicavel: D2 (migrar tudo para Claude Agent SDK) — NÃO INICIADA.

  agent_runtime:
    pacote: "@repo/agent-runtime"
    arquivos:
      - packages/agent-runtime/src/phases.ts        # AGENT_FLOW_PHASES, REPLAN_RETURNS_TO
      - packages/agent-runtime/src/commands/{bomdia,agora,estado,fechardia,replanejamento}.ts
      - packages/agent-runtime/src/output-schema.ts # orchestratorOutputSchema
      - packages/agent-runtime/src/format.ts
      - packages/agent-runtime/src/prompts/system.ts # COPILOT_SYSTEM_PROMPT (pt-BR)
      - packages/agent-runtime/src/tools.ts
      - packages/agent-runtime/src/evals/{graders,load-cases,types}.ts
    fases_implementadas: [SYNC, UNDERSTAND, STRUCTURE, VISUALIZE, PRE_APPROVE,
                           DECOMPOSE, EXECUTE, RECONCILE, REPORT, REPLAN]
    gate_estrutural_codificado: "REPLAN_RETURNS_TO = VISUALIZE"
    comandos_deterministicos:
      - id: bomdia
      - id: agora
      - id: estado
      - id: fechardia
      - id: replanejamento   # único de 2 passos (propose/confirm); não exposto no mobile
    rota_livre_ai: "apps/app/app/api/chat — usa @repo/ai (streamText), não os 5 comandos"
    maturidade: implementado, testado (suíte vitest própria) — não verificado
      end-to-end com OPENAI_API_KEY real nesta sessão.

  domain_state_machines:
    pacote: "@repo/domain"
    arquivos: [packages/domain/src/task-state.ts, packages/domain/src/routine-state.ts,
               packages/domain/src/day-range.ts]
    estados_task: [BACKLOG_VALIDATED, READY, DOING, VERIFY, DONE, BLOCKED]
    maturidade: implementado, testado.

  schemas:
    pacote: "@repo/schemas"
    arquivos: [actor, authority, authority-decision, billing, evidence, routine,
               scanner, task-state].ts
    contratos_camada1_ausentes: [HandoffEnvelope, FaseAtivacao, PerfilOperacional,
      FonteAutorizada, ModeloOperacional]  # Fase 1 do plano, não Fase 0
    maturidade: implementado (camada 2), ausente (camada 1 — Visão Normativa).

  application:
    pacote: "@repo/application"
    arquivos: [eligibility.ts, next-action.ts, rank-eligible-tasks.ts]
    maturidade: implementado, testado.

mcp:
  pacote: "@repo/mcp"
  transporte: "apps/api/app/mcp/route.ts (stateless, um McpServer por request)"
  tools_registradas_12:
    - projects.list / projects.get / projects.create
    - tasks.list / tasks.get / tasks.create / tasks.update
    - actions.get_next / actions.complete
    - evidence.create
    - state.get
    - routines.list / routines.run
    - reports.generate
    - mapa.generate
  catalogo_157_tools_prd_mcp: "NÃO incorporado — evidência: comentário do próprio
    packages/mcp/src/server.ts, linha ~99-104: 'NOT the 157-tool PRD-MCP.md
    catalog ... registered_reference / GATE PENDENTE'."
  gate_qst03_credencial_por_usuario_final: "bloqueia 70/157 tools (fonte: plano,
    não verificável nesta sessão — o PRD-MCP.md do Blueprint não está
    acessível aqui). D9 — decisão aberta."
  auditoria: "logToolCall() grava AuditEvent para toda chamada, sucesso ou falha
    (packages/mcp/src/server.ts)."
  bypass_de_autoridade: "Nenhum — mutações passam pelos mesmos guards de domínio
    (canTransitionTask etc.) com actor:AGENT; DOING/VERIFY/DONE retornam
    HUMAN_REQUIRED para todo chamador MCP (comentário do arquivo)."
  maturidade: implementado, testado (suítes com skipIf ausência de DATABASE_URL).

routines_modo_rotina:
  pacote: "@repo/routines"
  arquivos: [authority-gate.ts, idempotency.ts, pipeline.ts, scheduler.ts, events.ts,
             delivery/{app-reports,email,router,whatsapp}.ts]
  maquina_normativa_esperada: "Proposto → Confirmado → Ativo ⇄ Pausado, Ativo → Revisao → Ativo"
  maquina_implementada: "authority-gate.ts + idempotency.ts existem; máquina de
    estados nomeada 'Modo Rotina' com a semântica acima NÃO está codificada —
    routine-state.ts (packages/domain) usa RoutineStatus do Prisma, cujos
    valores precisam ser confrontados 1:1 com a máquina normativa na Fase 1."
  campos_obrigatorios_10: "não localizados como conjunto nomeado no código —
    LACUNA confirmada (plano §5.4: 'zero ocorrências no corpus')."
  cron: "apps/api/app/cron/routines/route.ts — 1x/dia (Vercel Hobby plan;
    degradação disclosed no próprio arquivo, revert documentado)."
  maturidade: parcialmente implementado (pipeline/idempotência), ausente
    (máquina normativa nomeada, 10 campos, política de fuso/retry — D10).

scanner:
  pacote: "@repo/scanner (lógica pura) + apps/mobile/src/features/scanner (on-device)"
  arquivos_pure: [dispatch, embedding-codec, event-latch, preprocess, recognize,
                  registry, roi, similarity, telemetry, types].ts
  arquivo_onnx: apps/mobile/src/features/scanner/vision/dinov2-encoder.ts
  simbolos_seed_v1: "3 símbolos (SYM-CHAT-001, SYM-SELECTOR-001, SYM-DONE-001—
    conferir nomes exatos em registry.ts na Fase 8, não confirmado letra-por-
    letra nesta auditoria)"
  session_run_executado_com_modelo_real: false
  evidencia: >
    dinov2-encoder.ts linha ~90: comentário do próprio arquivo diz que
    session.run() "never run against a real model file — everything
    upstream ... is packages/scanner's already-tested pure math;
    session.run() itself [não testado]". Confirma REC-006 (HIGH), ainda
    aberto — bloqueia Fase 8 (APP-VIS-001) e a alegação "Scanner VERIFICADO".
  maturidade: implementado (lógica pura, testada) / não testado (integração ONNX real).

