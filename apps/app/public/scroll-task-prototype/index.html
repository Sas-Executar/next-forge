<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Executar — Modo de Execução</title>
<style>
:root{--bg:#fff;--fg:#171717;--muted:#737373;--soft:#fafafa;--soft2:#f5f5f5;--line:#e5e5e5;--accent:#d9ff57;--ok:#087a55;--danger:#b42318;--hh:76px;--dh:96px;--r:12px;--shadow:0 1px 2px rgba(0,0,0,.04)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Geist,"Geist Sans",Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #171717;outline-offset:2px}.top{position:fixed;inset:0 0 auto 0;height:var(--hh);z-index:30;display:grid;grid-template-columns:1fr minmax(280px,640px) 1fr;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-weight:650;letter-spacing:-.02em}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--fg);color:#fff;font-weight:800}.project{text-align:center;min-width:0}.project strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project span{display:block;margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.commands{display:flex;justify-content:flex-end;align-items:center;gap:8px;position:relative}.cmd,.auto{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-size:13px;box-shadow:var(--shadow)}.cmd:hover,.auto:hover{background:var(--soft)}.auto[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}.auto .lamp{width:8px;height:8px;border-radius:50%;background:#bdbdbd}.auto[aria-pressed="true"] .lamp{background:var(--accent);box-shadow:0 0 0 3px rgba(217,255,87,.16)}.menu{display:none;position:absolute;right:0;top:52px;width:220px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.1)}.menu.open{display:block}.menu button{width:100%;min-height:42px;border:0;background:transparent;text-align:left;border-radius:8px;padding:0 10px;font-size:13px}.menu button:hover,.menu button.active{background:var(--soft2)}
.main{position:fixed;inset:var(--hh) 0 var(--dh) 0;background:linear-gradient(180deg,#fff 0%,#fefefe 100%)}.scroller{width:100%;height:100%;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y}.scroller::-webkit-scrollbar{display:none}.slide{width:100%;height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-rows:1fr auto 1fr;position:relative;padding:20px clamp(20px,8vw,140px)}.zone{display:flex;justify-content:center;color:#a3a3a3;font-size:11px;letter-spacing:.02em}.zone.topz{align-items:flex-end;padding-bottom:28px}.zone.botz{align-items:flex-start;padding-top:28px}.focus{width:min(900px,100%);margin:auto;text-align:center}.trail{font-size:12px;color:var(--muted);margin-bottom:15px}.num{font:500 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a3a3a3;margin-bottom:15px}.title{margin:0;font-size:clamp(36px,6.1vw,82px);font-weight:640;letter-spacing:-.055em;line-height:.98}.hint{margin-top:16px;font-size:12px;color:#a3a3a3}.detail{display:none;width:min(620px,100%);margin:24px auto 0;padding:18px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--soft);box-shadow:var(--shadow)}.detail.open{display:block}.detail p{font-size:14px;line-height:1.55;margin:0 0 12px}.detail textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px}.done .title{text-decoration:line-through;text-decoration-thickness:2px;color:#9b9b9b}.done .num:after{content:" · concluído";color:var(--ok)}
.dock{position:fixed;inset:auto 0 0 0;height:var(--dh);z-index:30;border-top:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:12px 24px}.timerbox{display:flex;align-items:center;gap:12px}.timer{font:650 25px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.04em;min-width:72px}.timerMeta{display:flex;flex-direction:column;gap:4px}.timerMeta span{font-size:11px;color:var(--muted)}select{height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;font-size:12px}.transport{display:flex;align-items:center;justify-content:center;gap:8px}.ib,.primary{height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:13px}.ib:hover{background:var(--soft)}.primary{background:var(--fg);border-color:var(--fg);color:#fff;font-weight:620;min-width:108px}.primary.doneState{background:var(--accent);border-color:var(--accent);color:var(--fg)}.stats{display:flex;justify-content:flex-end;align-items:center;gap:14px}.count{text-align:right}.count strong{display:block;font-size:14px}.count span{display:block;margin-top:3px;font-size:11px;color:var(--muted)}.progress{width:min(180px,18vw);height:4px;border-radius:999px;background:#ededed;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--fg);transition:width .25s ease}.toast{position:fixed;left:50%;bottom:calc(var(--dh) + 18px);z-index:50;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#171717;color:#fff;font-size:12px;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){:root{--hh:124px;--dh:146px}.top{grid-template-columns:1fr auto;grid-template-rows:56px 56px;padding:6px 16px;gap:0 10px}.project{grid-column:1/3;grid-row:2;text-align:left;border-top:1px solid var(--line);padding-top:10px}.commands{grid-column:2;grid-row:1}.brand{grid-column:1;grid-row:1}.dock{grid-template-columns:1fr auto;grid-template-rows:58px 58px;padding:8px 14px;gap:4px 10px}.timerbox{grid-column:1}.stats{grid-column:2}.transport{grid-column:1/3;grid-row:2}.progress{width:90px}.slide{padding-left:24px;padding-right:24px}.title{font-size:clamp(38px,10vw,64px)}}
@media(max-width:520px){.brand span{display:none}.commands .contextLabel,.commands .modeLabel{display:none}.cmd,.auto{padding:0 10px}.dock{--dh:150px}.timer{font-size:22px}.ib{padding:0 11px}.primary{min-width:92px}.count span{display:none}.progress{width:64px}.trail{font-size:11px}.hint{font-size:11px}}
@media(prefers-reduced-motion:reduce){.scroller{scroll-behavior:auto}.progress i,.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="mark">E</div><span>Executar</span></div>
  <div class="project"><strong>Lançamento do MVP</strong><span id="breadcrumb">Estratégia · Descoberta · Direcionamento do produto · 1 de 30</span></div>
  <div class="commands">
    <button class="auto" id="autoBtn" type="button" aria-pressed="false" title="Auto Mode"><span class="lamp"></span><span>Auto Mode</span></button>
    <button class="cmd" id="contextBtn" type="button"><span>＋</span><span class="contextLabel">Contexto</span></button>
    <button class="cmd" id="modeBtn" type="button" aria-expanded="false"><span class="modeLabel" id="modeLabel">Tarefas</span><span>⌄</span></button>
    <div class="menu" id="modeMenu" role="menu">
      <button data-mode="actions" type="button">Ação por ação</button>
      <button data-mode="tasks" class="active" type="button">Tarefa por tarefa</button>
      <button data-mode="phases" type="button">Fase por fase</button>
      <button data-mode="workflows" type="button">Workflow por workflow</button>
    </div>
  </div>
</header>
<main class="main"><div class="scroller" id="scroller" aria-label="Lista de execução"></div></main>
<footer class="dock">
  <div class="timerbox"><div class="timer" id="timer">30:00</div><div class="timerMeta"><span id="timerStatus">pronto</span><select id="duration" aria-label="Tempo previsto"><option value="900">15 min</option><option value="1800" selected>30 min</option><option value="2700">45 min</option><option value="10">10 s · demo</option></select></div></div>
  <div class="transport"><button class="ib" id="prev" type="button">←</button><button class="primary" id="start" type="button">Iniciar</button><button class="ib" id="complete" type="button">Concluir</button><button class="ib" id="next" type="button">→</button><button class="ib" id="reset" type="button" title="Reiniciar timer">↺</button></div>
  <div class="stats"><div class="count"><strong id="pending">30 pendentes</strong><span id="position">01 / 30</span></div><div class="progress" aria-hidden="true"><i id="progressBar"></i></div></div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),STORE='executar-scroll-v3';
const titles=['Definir objetivo','Validar entregável','Registrar restrições','Mapear usuários','Listar necessidades','Priorizar problemas','Definir escopo','Quebrar entregáveis','Ordenar dependências','Estimar esforço','Definir responsáveis','Confirmar critérios','Preparar ambiente','Reunir referências','Eliminar bloqueios','Produzir primeira versão','Revisar consistência','Ajustar entrega','Executar teste','Registrar falhas','Corrigir falhas','Preparar apresentação','Solicitar aprovação','Incorporar retorno','Finalizar artefatos','Registrar decisão','Atualizar status','Publicar entrega','Revisar pendências','Encerrar ciclo'];
const taskGroups=['Direcionamento do produto','Direcionamento do produto','Direcionamento do produto','Entendimento do usuário','Entendimento do usuário','Entendimento do usuário','Planejamento do ciclo','Planejamento do ciclo','Planejamento do ciclo','Planejamento operacional','Planejamento operacional','Planejamento operacional','Preparação da execução','Preparação da execução','Preparação da execução','Construção da entrega','Construção da entrega','Construção da entrega','Validação interna','Validação interna','Validação interna','Aprovação','Aprovação','Aprovação','Fechamento','Fechamento','Fechamento','Encerramento','Encerramento','Encerramento'];
const phases=titles.map((_,i)=>i<6?'Descoberta':i<12?'Planejamento':i<18?'Execução':i<24?'Validação':'Entrega');
const workflows=titles.map((_,i)=>i<12?'Estratégia':i<21?'Produção':'Entrega');
const contexts=titles.map((t,i)=>`${t}. Execute esta unidade dentro de ${taskGroups[i]}, mantendo o foco no entregável do ciclo. Use o campo abaixo apenas para contexto necessário à execução.`);
const tasks=titles.map((title,i)=>({id:i,title,task:taskGroups[i],phase:phases[i],workflow:workflows[i],context:contexts[i]}));
let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){}
let mode=saved.mode||'tasks',index=0,completed=new Set(saved.completed||[]),notes=saved.notes||{},auto=!!saved.auto,duration=Number(saved.duration)||1800,remaining=duration,running=false,ticker=null,scrollRAF=null,expanded=null;
const labels={actions:'Ações',tasks:'Tarefas',phases:'Fases',workflows:'Workflows'};
function units(){if(mode==='tasks'||mode==='actions')return tasks.map(t=>({title:t.title,task:t.task,phase:t.phase,workflow:t.workflow,context:t.context,ids:[t.id]}));const key=mode==='phases'?'phase':'workflow',seen=[];tasks.forEach(t=>{let u=seen.find(x=>x.title===t[key]);if(!u){u={title:t[key],ids:[],phase:t.phase,workflow:t.workflow,context:`Execute todas as unidades pertencentes a ${t[key]}.`};seen.push(u)}u.ids.push(t.id)});return seen}
function isDone(u){return u.ids.every(id=>completed.has(id))}
function persist(){localStorage.setItem(STORE,JSON.stringify({mode,completed:[...completed],notes,auto,duration}))}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function trail(u){if(mode==='workflows')return 'Workflow do projeto';if(mode==='phases')return `${u.workflow||'Projeto'} · Fase`;return `${u.workflow} · ${u.phase} · ${u.task}`}
function render(){const us=units(),s=$('scroller');index=Math.min(index,us.length-1);s.innerHTML=us.map((u,i)=>`<section class="slide ${isDone(u)?'done':''}" data-i="${i}"><div class="zone topz">${i?'↑ anterior':'início do ciclo'}</div><div class="focus"><div class="trail">${escapeHTML(trail(u))}</div><div class="num">${String(i+1).padStart(2,'0')}</div><h1 class="title">${escapeHTML(u.title)}</h1><div class="hint">duplo toque para contexto</div><div class="detail ${expanded===i?'open':''}" data-detail="${i}"><p>${escapeHTML(u.context)}</p><textarea data-note="${i}" placeholder="Adicionar nota de execução…">${escapeHTML(notes[noteKey(u)]||'')}</textarea></div></div><div class="zone botz">${i===us.length-1?'fim do ciclo':'próxima ↓'}</div></section>`).join('');
s.querySelectorAll('.slide').forEach(el=>{el.addEventListener('dblclick',e=>{if(e.target.tagName==='TEXTAREA')return;toggleDetail(Number(el.dataset.i))})});s.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{notes[noteKey(us[Number(el.dataset.note)])]=el.value;persist()}));updateUI();requestAnimationFrame(()=>s.scrollTop=index*s.clientHeight)}
function noteKey(u){return mode+':'+u.ids.join('-')}
function toggleDetail(i=index){expanded=expanded===i?null:i;const d=$('scroller').querySelector(`[data-detail="${i}"]`);if(d)d.classList.toggle('open',expanded===i)}
function updateUI(){const us=units(),u=us[index],done=us.filter(isDone).length,pending=us.length-done;$('modeLabel').textContent=labels[mode];$('breadcrumb').textContent=`${trail(u)} · ${index+1} de ${us.length}`;$('pending').textContent=`${pending} pendente${pending===1?'':'s'}`;$('position').textContent=`${String(index+1).padStart(2,'0')} / ${String(us.length).padStart(2,'0')}`;$('progressBar').style.width=`${us.length?done/us.length*100:0}%`;$('autoBtn').setAttribute('aria-pressed',String(auto));$('start').textContent=running?'Pausar':'Iniciar';$('complete').textContent=isDone(u)?'Reabrir':'Concluir';$('complete').classList.toggle('doneState',isDone(u));document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));persist()}
function fmt(v){v=Math.max(0,Math.ceil(v));return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}
function renderTimer(status){$('timer').textContent=fmt(remaining);if(status)$('timerStatus').textContent=status}
function stop(status='pausado'){running=false;if(ticker){clearInterval(ticker);ticker=null}renderTimer(status);updateUI()}
function resetTimer(status='pronto'){const was=running;if(ticker){clearInterval(ticker);ticker=null}remaining=duration;renderTimer(status);if(was)startTimer(true);else{running=false;updateUI()}}
function startTimer(resume=false){if(running&&!resume){stop();return}running=true;let prev=Date.now();renderTimer('executando');updateUI();if(ticker)clearInterval(ticker);ticker=setInterval(()=>{const now=Date.now();remaining-=Math.max(0,(now-prev)/1000);prev=now;if(remaining<=0){remaining=0;renderTimer();if(auto){const us=units();if(index<us.length-1){go(index+1,'smooth',true);remaining=duration;renderTimer('auto · próximo');prev=Date.now();flash('Auto Mode: próxima unidade')}else{stop('ciclo finalizado');flash('Ciclo finalizado')}}else stop('tempo concluído')}renderTimer()},200)}
function go(i,behavior='smooth',fromAuto=false){const us=units(),next=Math.max(0,Math.min(us.length-1,i));if(next===index&&i!==index)return;index=next;expanded=null;$('scroller').scrollTo({top:index*$('scroller').clientHeight,behavior});remaining=duration;renderTimer(running?(fromAuto?'auto · próximo':'executando'):'pronto');updateUI()}
function toggleComplete(){const u=units()[index],done=isDone(u);u.ids.forEach(id=>done?completed.delete(id):completed.add(id));persist();render();requestAnimationFrame(()=>go(index,'auto'));flash(done?'Unidade reaberta':'Unidade concluída');if(!done&&index<units().length-1)setTimeout(()=>go(index+1),260)}
function switchMode(m){mode=m;index=0;expanded=null;remaining=duration;persist();render();renderTimer(running?'executando':'pronto');$('modeMenu').classList.remove('open');$('modeBtn').setAttribute('aria-expanded','false')}
function flash(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1300)}
$('scroller').addEventListener('scroll',()=>{if(scrollRAF)cancelAnimationFrame(scrollRAF);scrollRAF=requestAnimationFrame(()=>{const h=$('scroller').clientHeight||1,n=Math.max(0,Math.min(units().length-1,Math.round($('scroller').scrollTop/h)));if(n!==index){index=n;expanded=null;remaining=duration;renderTimer(running?'executando':'pronto');updateUI()}})},{passive:true});
$('autoBtn').addEventListener('click',()=>{auto=!auto;persist();updateUI();flash(auto?'Auto Mode ativado':'Auto Mode desativado')});$('contextBtn').addEventListener('click',()=>toggleDetail());$('modeBtn').addEventListener('click',()=>{const m=$('modeMenu'),open=m.classList.toggle('open');$('modeBtn').setAttribute('aria-expanded',String(open))});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>switchMode(b.dataset.mode)));$('prev').addEventListener('click',()=>go(index-1));$('next').addEventListener('click',()=>go(index+1));$('complete').addEventListener('click',toggleComplete);$('start').addEventListener('click',()=>running?stop():startTimer());$('reset').addEventListener('click',()=>{remaining=duration;renderTimer(running?'executando':'pronto')});$('duration').value=String(duration);$('duration').addEventListener('change',()=>{duration=Number($('duration').value);remaining=duration;persist();renderTimer(running?'executando':'pronto')});
document.addEventListener('keydown',e=>{if(['TEXTAREA','SELECT','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();go(index+1)}if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(index-1)}if(e.key==='Enter'){e.preventDefault();toggleComplete()}if(e.code==='Space'){e.preventDefault();running?stop():startTimer()}});window.addEventListener('resize',()=>go(index,'auto'));document.addEventListener('click',e=>{if(!e.target.closest('.commands')){$('modeMenu').classList.remove('open');$('modeBtn').setAttribute('aria-expanded','false')}});
render();renderTimer('pronto');updateUI();
})();
</script>
</body>
</html>
