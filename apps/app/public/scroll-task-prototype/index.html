<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Executar — Modo de Execução</title><style>
:root{--fg:#171717;--mut:#616161;--sub:#8a8886;--line:#e1dfdd;--soft:#faf9f8;--soft2:#f3f2f1;--green:#107c10;--green2:#0b6a0b;--green-soft:#f1faf1;--top:84px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--r:10px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:var(--fg);font-family:Geist,"Geist Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.tap{min-width:44px;min-height:44px}button:focus-visible,select:focus-visible,textarea:focus-visible,.scroller:focus-visible{outline:2px solid var(--green);outline-offset:2px}.top{position:fixed;inset:0 0 auto;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) var(--s5) 0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(18px);z-index:40}.bar{height:var(--top);max-width:1600px;margin:auto;display:grid;grid-template-columns:1fr minmax(300px,680px) 1fr;align-items:center;gap:var(--s6)}.brand{display:flex;align-items:center;gap:var(--s3);font-size:16px;font-weight:650;letter-spacing:-.01em}.mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#171717;color:#fff;font-weight:800}.project{text-align:center;min-width:0}.project b,.project span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project b{font-size:16px;line-height:22px;font-weight:650;letter-spacing:-.01em}.project span{font-size:12px;line-height:16px;color:var(--mut);margin-top:var(--s1)}.project .signal{color:var(--green);font-weight:600}.cmds{display:flex;justify-content:flex-end;align-items:center;gap:var(--s2);position:relative}.cmd,.primary{height:44px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:0 var(--s3);display:flex;align-items:center;justify-content:center;gap:var(--s2);font-size:13px;font-weight:500}.cmd:hover{background:var(--soft)}.primary{background:#171717;border-color:#171717;color:#fff;font-weight:650;padding-inline:var(--s4)}.primary.done{background:var(--green-soft);border-color:#9fd89f;color:var(--green2)}.auto[aria-pressed=true]{background:var(--green-soft);border-color:#9fd89f;color:var(--green2)}.lamp{width:8px;height:8px;border-radius:50%;background:#c8c6c4}.auto[aria-pressed=true] .lamp{background:var(--green)}.timer{font:650 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.state{font-size:11px;color:var(--mut)}.menu{display:none;position:absolute;right:0;top:52px;width:310px;padding:var(--s2);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #0002}.menu.open{display:block}.menuLabel{display:block;color:var(--mut);font-size:11px;font-weight:600;padding:var(--s2) var(--s3) var(--s1);letter-spacing:.01em}.menu button,.menu select{width:100%;min-height:44px;border:0;border-radius:8px;background:transparent;text-align:left;padding:0 var(--s3);font-size:13px}.menu button:hover,.menu button.active{background:var(--soft2)}.menu button.active{font-weight:600}.menu select{border:1px solid var(--line);background:#fff}.hr{height:1px;background:var(--line);margin:var(--s1) var(--s2)}.toggleRow{display:flex!important;align-items:center;justify-content:space-between}.switch{width:34px;height:20px;border-radius:99px;background:#c8c6c4;padding:2px;display:inline-flex;align-items:center;transition:.15s}.switch i{width:16px;height:16px;border-radius:50%;background:#fff;display:block;transition:.15s}.toggleRow[aria-pressed=true] .switch{background:var(--green)}.toggleRow[aria-pressed=true] .switch i{transform:translateX(14px)}.menuNote{font-size:11px;line-height:16px;color:var(--mut);padding:var(--s1) var(--s3) var(--s2)}.main{position:fixed;inset:calc(var(--top) + env(safe-area-inset-top)) 0 0}.scroller{width:100%;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;-webkit-overflow-scrolling:touch}.scroller::-webkit-scrollbar{display:none}.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-rows:1fr auto 1fr;padding:var(--s5) clamp(24px,7vw,128px)}.zone{display:flex;justify-content:center;color:#a19f9d;font-size:11px;line-height:16px}.topz{align-items:flex-end;padding-bottom:var(--s8)}.botz{align-items:flex-start;padding-top:var(--s8)}.focus{width:min(880px,100%);margin:auto;text-align:center}.trail{font-size:13px;line-height:18px;color:var(--mut);margin-bottom:var(--s4)}.num{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:26px;padding:0 var(--s2);border-radius:99px;background:var(--green-soft);color:var(--green2);font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:var(--s5)}.title{margin:0;font-size:clamp(38px,5.5vw,72px);font-weight:640;letter-spacing:-.045em;line-height:1.02;text-wrap:balance}.hint{margin-top:var(--s5);font-size:12px;line-height:16px;color:var(--sub)}.detail{display:none;width:min(620px,100%);margin:var(--s6) auto 0;padding:var(--s5);text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.detail.open{display:block}.detail p{margin:0 0 var(--s4);font-size:14px;line-height:20px}.detail textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:var(--s3)}.isDone .title{text-decoration:line-through;text-decoration-thickness:2px;color:#8a8886}.isDone .num{background:var(--green);color:#fff}.hud{position:fixed;left:var(--s5);bottom:var(--s5);z-index:30;display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);border:1px solid var(--line);border-radius:12px;background:#fffffff2;backdrop-filter:blur(12px)}.prog{width:112px;height:5px;border-radius:99px;background:#edebe9;overflow:hidden}.prog i{display:block;height:100%;background:var(--green);transition:width .2s ease}.count b{display:block;font-size:13px;color:var(--green2);font-weight:650}.count span{display:block;font-size:10px;color:var(--mut);margin-top:2px}.mobileAction{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;z-index:80;background:#171717;color:#fff;border-radius:9px;padding:10px var(--s3);font-size:12px;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}

</style></head><body><header class="top"><div class="bar"><div class="brand"><div class="mark">E</div><span>Executar</span></div><div class="project"><b>Lançamento do MVP</b><span id="crumb">Estratégia · Descoberta · <span class="signal">1 de 30 tarefas</span></span></div><div class="cmds"><div class="cmd"><span class="timer" id="timer">30:00</span><span class="state" id="timerState">pronto</span></div><button class="cmd auto tap" id="auto" aria-pressed="false"><span class="lamp"></span><span class="autoText">Auto</span></button><button class="cmd ctx tap" id="context"><span>＋</span><span class="ctxText">Contexto</span></button><button class="primary desktopPrimary tap" id="doneTop">Concluir</button><button class="cmd tap" id="more" aria-expanded="false" aria-label="Mais opções">•••</button><div class="menu" id="menu"><span class="menuLabel">Granularidade</span><button data-mode="actions">Ação por ação</button><button data-mode="tasks" class="active">Tarefa por tarefa</button><button data-mode="phases">Fase por fase</button><button data-mode="workflows">Workflow por workflow</button><div class="hr"></div><span class="menuLabel">Tempo previsto</span><select id="duration"><option value="900">15 minutos</option><option value="1800">30 minutos</option><option value="2700">45 minutos</option><option value="10">10 segundos · demo</option></select><button id="timerBtn">Iniciar timer</button><button id="resetTimer">Reiniciar timer</button><div class="hr"></div><span class="menuLabel">Comportamento do scroll</span><button class="toggleRow" id="completeOnScroll" aria-pressed="false"><span>Concluir ao avançar</span><span class="switch"><i></i></span></button><div class="menuNote">Quando ativo, um scroll manual para a próxima tarefa conclui a tarefa anterior. Auto Mode e navegação por botões não concluem automaticamente.</div><div class="hr"></div><button id="resetProgress">Limpar conclusões</button></div></div></div></header><main class="main"><div class="scroller" id="scroller" tabindex="0" aria-label="Lista vertical de unidades de execução"></div></main><div class="hud"><div class="prog"><i id="bar"></i></div><div class="count"><b id="pending">30 pendentes</b><span id="pos">01 / 30</span></div></div><div class="mobileAction"><button class="primary tap" id="doneMobile">✓ Concluir</button></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
(()=>{const titles=['Definir objetivo','Validar entregável','Registrar restrições','Mapear usuários','Listar necessidades','Priorizar problemas','Definir escopo','Quebrar entregáveis','Ordenar dependências','Estimar esforço','Definir responsáveis','Confirmar critérios','Preparar ambiente','Reunir referências','Eliminar bloqueios','Produzir primeira versão','Revisar consistência','Ajustar entrega','Executar teste','Registrar falhas','Corrigir falhas','Preparar apresentação','Solicitar aprovação','Incorporar retorno','Finalizar artefatos','Registrar decisão','Atualizar status','Publicar entrega','Revisar pendências','Encerrar ciclo'];const groups=['Direcionamento do produto','Entendimento do usuário','Planejamento do ciclo','Planejamento operacional','Preparação da execução','Construção da entrega','Validação interna','Aprovação','Fechamento','Encerramento'];const phase=i=>i<6?'Descoberta':i<12?'Planejamento':i<21?'Execução/Validação':'Entrega';const workflow=i=>i<12?'Estratégia':i<21?'Produção':'Entrega';const base=titles.map((title,i)=>({id:'t'+(i+1),title,task:groups[Math.floor(i/3)],phase:phase(i),workflow:workflow(i),context:`Execute “${title}” dentro de ${groups[Math.floor(i/3)]}. Mantenha apenas o contexto necessário para concluir esta unidade.`}));const $=id=>document.getElementById(id),S='executar-scroll-v6',sc=$('scroller');let saved={};try{saved=JSON.parse(localStorage.getItem(S)||'{}')}catch{}let mode=saved.mode||'tasks',index=+saved.index||0,done=new Set(saved.done||[]),notes=saved.notes||{},auto=!!saved.auto,scrollCompletes=!!saved.scrollCompletes,duration=+saved.duration||1800,remaining=Number.isFinite(+saved.remaining)?+saved.remaining:duration,running=false,tick=null,last=0,status='pronto',programmaticUntil=0,scrollTimer=0;const modes={actions:'Ação por ação',tasks:'Tarefa por tarefa',phases:'Fase por fase',workflows:'Workflow por workflow'},nouns={actions:'ações',tasks:'tarefas',phases:'fases',workflows:'workflows'};function items(){if(mode==='tasks'||mode==='actions')return base;const key=mode==='phases'?'phase':'workflow',m=new Map;for(const t of base){if(!m.has(t[key]))m.set(t[key],{id:key+t[key],title:t[key],context:`Execute as tarefas pertencentes a ${t[key]}.`,members:[]});m.get(t[key]).members.push(t.id)}return[...m.values()]}function ids(it){return it.members||[it.id]}function isDone(it){return ids(it).every(id=>done.has(id))}function save(){localStorage.setItem(S,JSON.stringify({mode,index,done:[...done],notes,auto,scrollCompletes,duration,remaining}))}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function trail(it){return mode==='tasks'||mode==='actions'?`${it.workflow} · ${it.phase} · ${it.task}`:modes[mode]}function render(){const a=items();index=Math.max(0,Math.min(index,a.length-1));sc.innerHTML=a.map((it,i)=>`<section class="slide ${isDone(it)?'isDone':''}" data-i="${i}"><div class="zone topz">${i?'↑ anterior':''}</div><div class="focus"><div class="trail">${esc(trail(it))}</div><div class="num">${String(i+1).padStart(2,'0')}</div><h1 class="title">${esc(it.title)}</h1><div class="hint">Duplo toque para contexto</div><div class="detail"><p>${esc(it.context)}</p><textarea data-note="${esc(it.id)}" placeholder="Adicionar nota...">${esc(notes[it.id]||'')}</textarea></div></div><div class="zone botz">${i<a.length-1?'próxima ↓':''}</div></section>`).join('');sc.querySelectorAll('textarea').forEach(x=>x.oninput=e=>{notes[e.target.dataset.note]=e.target.value;save()});requestAnimationFrame(()=>go(index,false));ui()}function syncDone(){const a=items();sc.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('isDone',!!a[i]&&isDone(a[i])))}function ui(){const a=items(),it=a[index]||a[0],p=base.length-done.size,progress=Math.round((base.length-p)/base.length*100);$('crumb').innerHTML=mode==='tasks'||mode==='actions'?`${esc(it.workflow)} · ${esc(it.phase)} · <span class="signal">${index+1} de ${a.length} ${nouns[mode]}</span>`:`${modes[mode]} · <span class="signal">${index+1} de ${a.length}</span>`;$('pending').textContent=`${p} pendente${p===1?'':'s'}`;$('pos').textContent=`${String(index+1).padStart(2,'0')} / ${String(a.length).padStart(2,'0')} · ${progress}%`;$('bar').style.width=progress+'%';$('auto').setAttribute('aria-pressed',auto);$('completeOnScroll').setAttribute('aria-pressed',scrollCompletes);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const d=isDone(it);[$('doneTop'),$('doneMobile')].forEach(b=>{b.classList.toggle('done',d);b.textContent=d?'↶ Reabrir':b.id==='doneMobile'?'✓ Concluir':'Concluir'});$('timer').textContent=fmt(remaining);$('timerState').textContent=running?'em execução':status;$('timerBtn').textContent=running?'Pausar timer':'Iniciar timer';$('duration').value=duration;save()}function go(n,smooth=true){const a=items();index=Math.max(0,Math.min(n,a.length-1));programmaticUntil=Date.now()+(smooth?1000:300);sc.querySelector(`[data-i="${index}"]`)?.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'});ui()}function toggleDone(){const a=items(),it=a[index],all=isDone(it);ids(it).forEach(id=>all?done.delete(id):done.add(id));syncDone();ui();say(all?'Tarefa reaberta':'Tarefa concluída');if(!all&&index<a.length-1)setTimeout(()=>go(index+1),140)}function detail(){sc.querySelector(`[data-i="${index}"] .detail`)?.classList.toggle('open')}function fmt(s){s=Math.max(0,Math.ceil(s));return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function start(){if(running){stop('pausado');return}if(remaining<=0)remaining=duration;running=true;status='em execução';last=Date.now();tick=setInterval(()=>{const now=Date.now();remaining-=Math.max(0,(now-last)/1000);last=now;if(remaining<=0){remaining=0;if(auto&&index<items().length-1){go(index+1);remaining=duration;last=Date.now();say('Auto · próxima unidade')}else stop(index>=items().length-1?'ciclo finalizado':'tempo concluído')}ui()},250);ui()}function stop(s='pronto'){running=false;status=s;if(tick){clearInterval(tick);tick=null}ui()}let tt;function say(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),1400)}function settleScroll(){const a=items(),n=Math.max(0,Math.min(Math.round(sc.scrollTop/sc.clientHeight),a.length-1));if(n===index)return;const prev=index,manual=Date.now()>programmaticUntil;if(manual&&scrollCompletes&&(mode==='tasks'||mode==='actions')&&n>prev){const prior=a[prev];ids(prior).forEach(id=>done.add(id));syncDone();say('Concluído pelo scroll')}index=n;ui()}$('auto').onclick=()=>{auto=!auto;ui();say(auto?'Auto Mode ativado':'Auto Mode desativado')};$('context').onclick=detail;$('doneTop').onclick=$('doneMobile').onclick=toggleDone;$('completeOnScroll').onclick=()=>{scrollCompletes=!scrollCompletes;ui();say(scrollCompletes?'Scroll manual conclui ao avançar':'Scroll não altera conclusão')};$('more').onclick=()=>{const o=$('menu').classList.toggle('open');$('more').setAttribute('aria-expanded',o)};document.onclick=e=>{if(!$('menu').contains(e.target)&&!$('more').contains(e.target))$('menu').classList.remove('open')};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;index=0;$('menu').classList.remove('open');render()});$('duration').onchange=e=>{duration=+e.target.value;remaining=duration;stop()};$('timerBtn').onclick=start;$('resetTimer').onclick=()=>{remaining=duration;stop()};$('resetProgress').onclick=()=>{done.clear();syncDone();ui();say('Conclusões limpas')};sc.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(settleScroll,140)},{passive:true});if('onscrollend'in sc)sc.addEventListener('scrollend',settleScroll);sc.ondblclick=e=>{if(!e.target.closest('textarea'))detail()};document.onkeydown=e=>{if(['TEXTAREA','SELECT','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();go(index+1)}else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(index-1)}else if(e.key===' '){e.preventDefault();start()}else if(e.key==='Enter'){e.preventDefault();toggleDone()}else if(e.key==='Escape')$('menu').classList.remove('open')};render()})();
</script></body></html>
