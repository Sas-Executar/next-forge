<script>(()=>{const titles=['Definir objetivo','Validar entregável','Registrar restrições','Mapear usuários','Listar necessidades','Priorizar problemas','Definir escopo','Quebrar entregáveis','Ordenar dependências','Estimar esforço','Definir responsáveis','Confirmar critérios','Preparar ambiente','Reunir referências','Eliminar bloqueios','Produzir primeira versão','Revisar consistência','Ajustar entrega','Executar teste','Registrar falhas','Corrigir falhas','Preparar apresentação','Solicitar aprovação','Incorporar retorno','Finalizar artefatos','Registrar decisão','Atualizar status','Publicar entrega','Revisar pendências','Encerrar ciclo'];const groups=['Direcionamento do produto','Entendimento do usuário','Planejamento do ciclo','Planejamento operacional','Preparação da execução','Construção da entrega','Validação interna','Aprovação','Fechamento','Encerramento'];const phase=i=>i<6?'Descoberta':i<12?'Planejamento':i<21?'Execução e validação':'Entrega',workflow=i=>i<12?'Estratégia':i<21?'Produção':'Entrega';const base=titles.map((title,i)=>({id:'t'+(i+1),title,task:groups[Math.floor(i/3)],phase:phase(i),workflow:workflow(i),context:`Execute “${title}” dentro de ${groups[Math.floor(i/3)]}. Mantenha somente o contexto necessário para concluir esta unidade.`}));const $=id=>document.getElementById(id),sc=$('scroller'),STORE='executar-scroll-v7';let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')}catch{}let view=saved.view==='list'?'list':'scroll',mode=saved.mode||'tasks',index=Number.isFinite(+saved.index)?+saved.index:0,done=new Set(saved.done||[]),notes=saved.notes||{},auto=!!saved.auto,scrollCompletes=saved.scrollCompletes===undefined?true:!!saved.scrollCompletes,duration=+saved.duration||1800,remaining=Number.isFinite(+saved.remaining)?+saved.remaining:duration,running=false,tick=null,lastTick=0,status='pronto',programmaticUntil=0,settleTimer=0,lastTap=0,manualForward=false,touchY=null;const modes={actions:'Ação por ação',tasks:'Tarefa por tarefa',phases:'Fase por fase',workflows:'Workflow por workflow'};function items(){if(mode==='tasks'||mode==='actions')return base;const key=mode==='phases'?'phase':'workflow',m=new Map;for(const t of base){if(!m.has(t[key]))m.set(t[key],{id:key+t[key],title:t[key],context:`Execute as tarefas de ${t[key]}.`,members:[]});m.get(t[key]).members.push(t.id)}return[...m.values()]}const ids=it=>it.members||[it.id],isDone=it=>ids(it).every(id=>done.has(id)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(STORE,JSON.stringify({view,mode,index,done:[...done],notes,auto,scrollCompletes,duration,remaining}))}catch{}}function hierarchy(it){return mode==='tasks'||mode==='actions'?`${it.workflow} · ${it.phase} · ${it.task}`:modes[mode]}function render(){sc.classList.toggle('listView',view==='list');const a=items();index=Math.max(0,Math.min(index,a.length-1));sc.innerHTML=a.map((it,i)=>{const complete=isDone(it),pending=Math.max(0,base.length-done.size),kind=mode==='actions'?'ação':mode==='tasks'?'tarefa':'unidade';return `<section class="slide ${complete?'isDone':''}" data-i="${i}"><div class="zone topz">${i?'↑ anterior':''}</div><div class="focus"><div class="eyebrow"><span class="index">${String(i+1).padStart(2,'0')} / ${String(a.length).padStart(2,'0')}</span><span class="unitState">${complete?'Concluído':'Próxima '+kind}</span></div><h2 class="title">${esc(it.title)}</h2><div class="meta"><div class="pending">${complete?'✓ concluído':'↓ '+pending+' pendente'+(pending===1?'':'s')}</div><div class="trail">${esc(hierarchy(it))}</div></div><div class="hint">Duplo toque para contexto · ${scrollCompletes&&(mode==='tasks'||mode==='actions')?'deslize para concluir e avançar':'deslize para navegar'}</div><div class="rowActions"><button class="btn" data-select="${i}" aria-label="Selecionar ${esc(it.title)}">Selecionar</button><button class="btn" data-complete="${i}" aria-pressed="${complete}" aria-label="${complete?'Reabrir':'Concluir'} ${esc(it.title)}">${complete?'✓ Concluído':'Concluir'}</button><button class="btn" data-context="${i}" aria-expanded="false" aria-label="Contexto de ${esc(it.title)}">Contexto</button></div><div class="detail"><p>${esc(it.context)}</p><textarea aria-label="Nota de execução: ${esc(it.title)}" data-note="${esc(it.id)}" placeholder="Adicionar nota de execução...">${esc(notes[it.id]||'')}</textarea></div></div><div class="zone botz">${i<a.length-1?'próxima ↓':''}</div></section>`}).join('');sc.querySelectorAll('textarea').forEach(x=>x.addEventListener('input',e=>{notes[e.target.dataset.note]=e.target.value;save()}));requestAnimationFrame(()=>go(index,false,false));ui()}function syncDone(){const a=items(),pending=Math.max(0,base.length-done.size);sc.querySelectorAll('.slide').forEach((el,i)=>{if(!a[i])return;const complete=isDone(a[i]);el.classList.toggle('isDone',complete);el.querySelector('.unitState').textContent=complete?'Concluído':(mode==='actions'?'Próxima ação':'Próxima unidade');const button=el.querySelector('[data-complete]');if(button){button.textContent=complete?'✓ Concluído':'Concluir';button.setAttribute('aria-pressed',String(complete));button.setAttribute('aria-label',(complete?'Reabrir ':'Concluir ')+a[i].title)}el.querySelector('.pending').textContent=complete?'✓ concluído':'↓ '+pending+' pendente'+(pending===1?'':'s')})}function ui(){const a=items(),it=a[index]||a[0],pending=Math.max(0,base.length-done.size),progress=(base.length-pending)/base.length*100,d=isDone(it);$('viewToggle').setAttribute('aria-pressed',String(view==='list'));$('completeOnScroll').disabled=view==='list';document.querySelector('.note').textContent=view==='list'?'Na lista, rolar apenas navega. Use Concluir na unidade selecionada.':'Scroll manual para a próxima ação ou tarefa conclui a anterior. Auto Mode e navegação por teclado não concluem.';$('completeOnScroll').setAttribute('title',view==='list'?'No modo lista, a conclusão é explícita':'Concluir ao avançar no modo scroll');$('previousUnit').disabled=index===0;$('nextUnit').disabled=index===a.length-1;if($('navigator').open)renderNavigation();$('progressBar').style.width=progress+'%';$('progressBar').parentElement.setAttribute('aria-valuenow',String(base.length-pending));$('progressBar').parentElement.setAttribute('aria-valuetext',`${base.length-pending} de ${base.length} tarefas concluídas`);const position=`${index+1} de ${a.length}: ${it.title}. ${d?'Concluído':'Pendente'}`;if($('positionStatus').textContent!==position)$('positionStatus').textContent=position;sc.querySelectorAll('.slide').forEach((el,i)=>{el.setAttribute('aria-current',String(i===index));const select=el.querySelector('[data-select]');if(select){select.textContent=i===index?'Selecionada':'Selecionar';select.setAttribute('aria-pressed',String(i===index))}el.querySelectorAll('textarea').forEach(t=>t.tabIndex=view==='list'||i===index?0:-1)});$('context').setAttribute('aria-expanded',String(!!sc.querySelector(`[data-i="${index}"] .detail.open`)));$('timerToggle').setAttribute('aria-label',running?'Pausar timer':'Iniciar timer');$('timerToggle').setAttribute('aria-pressed',String(running));$('auto').setAttribute('aria-pressed',String(auto));$('completeOnScroll').setAttribute('aria-pressed',String(scrollCompletes));document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});[$('doneTop'),$('doneMobile')].forEach(b=>{b.classList.toggle('done',d);b.textContent=d?'Reabrir':b.id==='doneMobile'?'Concluir '+(mode==='tasks'?'tarefa':'unidade'):'Concluir'});$('timer').textContent=fmt(remaining);$('timerState').textContent=running?'ativo':status;$('duration').value=String(duration);save()}function go(n,smooth=true,record=true){const a=items();index=Math.max(0,Math.min(n,a.length-1));manualForward=false;programmaticUntil=Date.now()+1200;sc.querySelector(`[data-i="${index}"]`)?.scrollIntoView({behavior:smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'instant',block:view==='list'?'nearest':'start'});if(record)writeRoute();ui()}function toggleDone(){const a=items(),it=a[index],was=isDone(it);ids(it).forEach(id=>was?done.delete(id):done.add(id));syncDone();ui();say(was?'Unidade reaberta':'Unidade concluída');if(view==='scroll'&&!was&&index<a.length-1)setTimeout(()=>go(index+1),180)}function detail(){const panel=sc.querySelector(`[data-i="${index}"] .detail`);panel?.classList.toggle('open');sc.querySelector(`[data-context="${index}"]`)?.setAttribute('aria-expanded',String(!!panel?.classList.contains('open')));ui()}function fmt(s){s=Math.max(0,Math.ceil(s));return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function stop(s='pronto'){running=false;status=s;if(tick){clearInterval(tick);tick=null}ui()}function timerToggle(){if(running){stop('pausado');return}if(remaining<=0)remaining=duration;running=true;status='ativo';lastTick=Date.now();tick=setInterval(()=>{const now=Date.now();remaining-=Math.max(0,(now-lastTick)/1000);lastTick=now;if(remaining<=0){remaining=0;if(auto&&index<items().length-1){go(index+1);remaining=duration;lastTick=Date.now();say('Auto Mode · próxima unidade')}else stop(index>=items().length-1?'ciclo finalizado':'tempo concluído')}ui()},250);ui()}let toastTimer;function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1450)}function settle(){if(view==='list'){manualForward=false;return}const a=items(),slides=[...sc.querySelectorAll('.slide')],top=sc.getBoundingClientRect().top;let next=index,best=Infinity;slides.forEach((el,i)=>{const distance=Math.abs(el.getBoundingClientRect().top-top);if(distance<best){best=distance;next=i}});if(next===index){manualForward=false;return}const prev=index,manual=manualForward&&Date.now()>programmaticUntil;manualForward=false;if(manual&&scrollCompletes&&(mode==='tasks'||mode==='actions')&&next===prev+1){const prior=a[prev],was=isDone(prior);ids(prior).forEach(id=>done.add(id));syncDone();if(!was)say('Concluído pelo scroll')}index=next;writeRoute(false);ui()}function closeMenu(focus=false){$('menu').classList.remove('open');$('more').setAttribute('aria-expanded','false');if(focus)$('more').focus()}
sc.addEventListener('wheel',e=>{if(!e.isTrusted||e.ctrlKey||e.target.closest('textarea'))return;manualForward=e.deltaY>0;programmaticUntil=0},{passive:true});sc.addEventListener('touchstart',e=>{touchY=e.touches[0]?.clientY;manualForward=false},{passive:true});sc.addEventListener('touchmove',e=>{if(!e.isTrusted||e.target.closest('textarea')||touchY===null)return;const y=e.touches[0]?.clientY;if(Math.abs(y-touchY)>8){manualForward=y<touchY;programmaticUntil=0;touchY=y}},{passive:true});
new ResizeObserver(()=>{manualForward=false;programmaticUntil=Date.now()+1200;document.documentElement.style.setProperty('--header-height',document.querySelector('.top').getBoundingClientRect().height+'px')}).observe(document.querySelector('.top'));
$('timerToggle').onclick=timerToggle;$('auto').onclick=()=>{auto=!auto;ui();say(auto?'Auto Mode ativado':'Auto Mode desativado')};$('context').onclick=detail;$('doneTop').onclick=$('doneMobile').onclick=toggleDone;$('completeOnScroll').onclick=()=>{scrollCompletes=!scrollCompletes;render();say(scrollCompletes?'Scroll conclui ao avançar':'Scroll apenas navega')};$('more').onclick=()=>{const o=$('menu').classList.toggle('open');$('more').setAttribute('aria-expanded',String(o));if(o)$('menu').querySelector('button').focus()};document.addEventListener('click',e=>{if(!$('menu').contains(e.target)&&!$('more').contains(e.target)){$('menu').classList.remove('open');$('more').setAttribute('aria-expanded','false')}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{closeMenu(true);changeMode(b.dataset.mode)});$('duration').onchange=e=>{duration=+e.target.value;remaining=duration;stop()};$('resetTimer').onclick=()=>{remaining=duration;stop();say('Timer reiniciado')};$('resetProgress').onclick=()=>{done.clear();syncDone();ui();say('Conclusões limpas')};sc.addEventListener('scroll',()=>{clearTimeout(settleTimer);settleTimer=setTimeout(settle,150)},{passive:true});if('onscrollend'in sc)sc.addEventListener('scrollend',settle);sc.addEventListener('pointerup',e=>{if(e.target.closest('textarea,button,select'))return;const now=Date.now();if(now-lastTap<330){detail();lastTap=0}else lastTap=now});document.addEventListener('keydown',e=>{if($('navigator').open)return;if(e.key==='Escape'){closeMenu(true);return}if(e.target.closest('button,textarea,select,input,[contenteditable=true],#menu'))return;if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();go(index+1)}else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(index-1)}else if(e.key===' '){e.preventDefault();timerToggle()}else if(e.key==='Enter'){e.preventDefault();toggleDone()}else if(e.key==='Escape'){$('menu').classList.remove('open');$('more').setAttribute('aria-expanded','false')}});
function writeRoute(push=true){const it=items()[index];const hash='#'+new URLSearchParams({view,mode,unit:it.id});if(location.hash===hash)return;history[push?'pushState':'replaceState'](null,'',hash)}
function readRoute(){const params=new URLSearchParams(location.hash.slice(1));const v=params.get('view'),m=params.get('mode');if(v!=='list'&&v!=='scroll')return false;if(!Object.hasOwn(modes,m))return false;view=v;mode=m;const found=items().findIndex(it=>it.id===params.get('unit'));index=found<0?0:found;manualForward=false;return true}
function changeMode(nextMode){if(!Object.hasOwn(modes,nextMode))return;const anchor=ids(items()[index])[0];mode=nextMode;index=Math.max(0,items().findIndex(it=>ids(it).includes(anchor)));render();writeRoute()}
function renderNavigation(){const a=items();$('navPosition').textContent=`${index+1} de ${a.length} · ${a[index].title}`;document.querySelectorAll('[data-nav-mode]').forEach(b=>{const active=b.dataset.navMode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});const signature=mode+':'+index+':'+[...done].join(',');if($('navUnits').dataset.signature===signature)return;$('navUnits').dataset.signature=signature;$('navUnits').innerHTML=a.map((it,i)=>`<button class="btn" data-jump="${i}" aria-current="${i===index}">${i+1}. ${esc(it.title)}${isDone(it)?' · ✓ Concluído':''}</button>`).join('')}
$('viewToggle').onclick=()=>{view=view==='list'?'scroll':'list';manualForward=false;render();writeRoute();say(view==='list'?'Modo lista · conclusão por botão':'Modo scroll')};
$('navigate').onclick=()=>{closeMenu();renderNavigation();$('navigator').showModal()};$('closeNavigator').onclick=()=>$('navigator').close();$('navigator').addEventListener('close',()=>$('navigate').focus());
$('previousUnit').onclick=()=>go(index-1);$('nextUnit').onclick=()=>go(index+1);
document.querySelectorAll('[data-nav-mode]').forEach(b=>b.onclick=()=>changeMode(b.dataset.navMode));
$('navUnits').onclick=e=>{const b=e.target.closest('[data-jump]');if(!b)return;go(+b.dataset.jump);$('navigator').close()};
sc.addEventListener('click',e=>{const b=e.target.closest('[data-select],[data-complete],[data-context]');if(!b)return;manualForward=false;index=+(b.dataset.select??b.dataset.complete??b.dataset.context);writeRoute();if(b.hasAttribute('data-complete'))toggleDone();else if(b.hasAttribute('data-context'))detail();else{ui();say('Unidade selecionada')}});
window.addEventListener('popstate',()=>{if(readRoute()){closeMenu();if($('navigator').open)$('navigator').close();render()}});
readRoute();render();writeRoute(false);
})();</script></body></html>
