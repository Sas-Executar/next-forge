<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Executar — Modo de Execução</title><style>
:root{--bg:#f6f6f4;--surface:#fff;--fg:#111;--muted:#737373;--sub:#a0a0a0;--line:#e5e5e1;--green:#32c878;--green-ink:#17784a;--green-soft:#e3f7ec;--coral:#ef5b4f;--top:92px;--shadow:0 18px 55px #1111}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Geist,"Geist Sans",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible,.scroller:focus-visible{outline:3px solid #32c87866;outline-offset:2px}.progress{position:fixed;inset:0 0 auto;height:5px;background:#dfdfdc;z-index:70}.progress i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}.top{position:fixed;inset:5px 0 auto;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 24px 0;background:#f6f6f4e8;backdrop-filter:blur(22px);z-index:60}.bar{height:var(--top);max-width:1540px;margin:auto;display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(360px,1fr);align-items:center;gap:24px}.brand{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}.project{font-size:18px;font-weight:720;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timerPill,.btn{height:46px;border:1px solid var(--line);background:var(--surface);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-weight:620;font-size:13px}.timerPill{min-width:112px}.timer{font:720 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.timerState{font-size:11px;color:var(--muted)}.commands{display:flex;justify-content:flex-end;align-items:center;gap:8px;position:relative}.icon{width:46px;padding:0}.primary{background:var(--fg);border-color:var(--fg);color:#fff;padding:0 22px}.primary.done{background:var(--green-soft);border-color:#a9e7c6;color:var(--green-ink)}.auto[aria-pressed=true]{background:var(--green-soft);border-color:#a9e7c6;color:var(--green-ink)}.dot{width:9px;height:9px;border-radius:50%;background:#cacac7}.auto[aria-pressed=true] .dot{background:var(--green);box-shadow:0 0 0 4px #32c8781f}.menu{display:none;position:absolute;right:0;top:56px;width:330px;padding:8px;background:#fffffff7;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.menu.open{display:block}.label{display:block;padding:10px 12px 6px;font-size:11px;font-weight:720;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}.menu button,.menu select{width:100%;min-height:44px;border:0;border-radius:12px;background:transparent;text-align:left;padding:0 12px;font-size:14px}.menu button:hover,.menu button.active{background:#f1f1ee}.menu button.active{font-weight:720}.menu select{border:1px solid var(--line);background:#fafaf8}.sep{height:1px;background:var(--line);margin:6px 8px}.toggle{display:flex!important;align-items:center;justify-content:space-between}.switch{width:38px;height:22px;border-radius:99px;background:#cacac7;padding:2px;display:inline-flex}.switch i{width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.toggle[aria-pressed=true] .switch{background:var(--green)}.toggle[aria-pressed=true] .switch i{transform:translateX(16px)}.note{padding:4px 12px 10px;color:var(--muted);font-size:11px;line-height:16px}.danger{color:#b73e36!important}.main{position:fixed;inset:calc(5px + var(--top) + env(safe-area-inset-top)) 0 0}.scroller{width:100%;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;-webkit-overflow-scrolling:touch}.scroller::-webkit-scrollbar{display:none}.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-rows:1fr auto 1fr;padding:24px clamp(24px,8vw,144px)}.zone{display:flex;justify-content:center;color:#b1b1ad;font-size:11px}.zone.topz{align-items:flex-end;padding-bottom:32px}.zone.botz{align-items:flex-start;padding-top:32px}.focus{width:min(980px,100%);margin:auto;text-align:left}.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;font-weight:650;color:var(--muted)}.index{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--green-ink);font:720 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.title{margin:0;max-width:920px;font-size:clamp(58px,8vw,118px);font-weight:740;letter-spacing:-.065em;line-height:.9;text-wrap:balance}.meta{margin-top:20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.pending{color:var(--green);font-size:clamp(24px,3.3vw,44px);font-weight:620;letter-spacing:-.04em}.trail{color:var(--muted);font-size:13px}.hint{margin-top:20px;color:var(--sub);font-size:12px}.detail{display:none;width:min(720px,100%);margin-top:24px;padding:24px;border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:0 1px 0 #1111}.detail.open{display:block}.detail p{margin:0 0 16px;font-size:15px;line-height:22px}.detail textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:18px;background:#fafaf8;padding:14px 16px;resize:vertical}.isDone .title{color:#777;text-decoration:line-through;text-decoration-thickness:3px}.isDone .index{background:var(--green);border-color:var(--green);color:#fff}.mobileAction{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);opacity:0;z-index:90;background:#111;color:#fff;border-radius:999px;padding:11px 16px;font-size:12px;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}

</style></head><body>
<div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
<header class="top"><div class="bar"><div class="identity"><div class="brand">Executar</div><div class="project">Lançamento do MVP</div></div><div class="timerWrap"><button class="timerPill" id="timerToggle" type="button"><span class="timer" id="timer">30:00</span><span class="timerState" id="timerState">pronto</span></button></div><div class="commands"><button class="btn auto" id="auto" aria-pressed="false"><span class="dot"></span><span class="autoText">Auto</span></button><button class="btn context" id="context"><span>＋</span><span class="contextText">Contexto</span></button><button class="btn primary desktopPrimary" id="doneTop">Concluir</button><button class="btn icon more" id="more" aria-expanded="false" aria-label="Mais opções">•••</button><div class="menu" id="menu"><span class="label">Granularidade</span><button data-mode="actions">Ação por ação</button><button data-mode="tasks">Tarefa por tarefa</button><button data-mode="phases">Fase por fase</button><button data-mode="workflows">Workflow por workflow</button><div class="sep"></div><span class="label">Tempo previsto</span><select id="duration"><option value="900">15 minutos</option><option value="1800">30 minutos</option><option value="2700">45 minutos</option><option value="10">10 segundos · demo</option></select><button id="resetTimer">Reiniciar timer</button><div class="sep"></div><span class="label">Scroll</span><button class="toggle" id="completeOnScroll" aria-pressed="true"><span>Concluir ao avançar</span><span class="switch"><i></i></span></button><div class="note">Scroll manual para a próxima unidade conclui a anterior. Auto Mode e navegação por teclado não concluem.</div><div class="sep"></div><button class="danger" id="resetProgress">Limpar conclusões</button></div></div></div></header>
<main class="main"><div class="scroller" id="scroller" tabindex="0" aria-label="Unidades de execução"></div></main><div class="mobileAction"><button class="btn primary" id="doneMobile">Concluir tarefa</button></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>(()=>{const titles=['Definir objetivo','Validar entregável','Registrar restrições','Mapear usuários','Listar necessidades','Priorizar problemas','Definir escopo','Quebrar entregáveis','Ordenar dependências','Estimar esforço','Definir responsáveis','Confirmar critérios','Preparar ambiente','Reunir referências','Eliminar bloqueios','Produzir primeira versão','Revisar consistência','Ajustar entrega','Executar teste','Registrar falhas','Corrigir falhas','Preparar apresentação','Solicitar aprovação','Incorporar retorno','Finalizar artefatos','Registrar decisão','Atualizar status','Publicar entrega','Revisar pendências','Encerrar ciclo'];const groups=['Direcionamento do produto','Entendimento do usuário','Planejamento do ciclo','Planejamento operacional','Preparação da execução','Construção da entrega','Validação interna','Aprovação','Fechamento','Encerramento'];const phase=i=>i<6?'Descoberta':i<12?'Planejamento':i<21?'Execução e validação':'Entrega',workflow=i=>i<12?'Estratégia':i<21?'Produção':'Entrega';const base=titles.map((title,i)=>({id:'t'+(i+1),title,task:groups[Math.floor(i/3)],phase:phase(i),workflow:workflow(i),context:`Execute “${title}” dentro de ${groups[Math.floor(i/3)]}. Mantenha somente o contexto necessário para concluir esta unidade.`}));const $=id=>document.getElementById(id),sc=$('scroller'),STORE='executar-scroll-v7';let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')}catch{}let mode=saved.mode||'tasks',index=Number.isFinite(+saved.index)?+saved.index:0,done=new Set(saved.done||[]),notes=saved.notes||{},auto=!!saved.auto,scrollCompletes=saved.scrollCompletes===undefined?true:!!saved.scrollCompletes,duration=+saved.duration||1800,remaining=Number.isFinite(+saved.remaining)?+saved.remaining:duration,running=false,tick=null,lastTick=0,status='pronto',programmaticUntil=0,settleTimer=0,lastTap=0;const modes={actions:'Ação por ação',tasks:'Tarefa por tarefa',phases:'Fase por fase',workflows:'Workflow por workflow'};function items(){if(mode==='tasks'||mode==='actions')return base;const key=mode==='phases'?'phase':'workflow',m=new Map;for(const t of base){if(!m.has(t[key]))m.set(t[key],{id:key+t[key],title:t[key],context:`Execute as tarefas de ${t[key]}.`,members:[]});m.get(t[key]).members.push(t.id)}return[...m.values()]}const ids=it=>it.members||[it.id],isDone=it=>ids(it).every(id=>done.has(id)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(STORE,JSON.stringify({mode,index,done:[...done],notes,auto,scrollCompletes,duration,remaining}))}function hierarchy(it){return mode==='tasks'||mode==='actions'?`${it.workflow} · ${it.phase} · ${it.task}`:modes[mode]}function render(){const a=items();index=Math.max(0,Math.min(index,a.length-1));sc.innerHTML=a.map((it,i)=>{const complete=isDone(it),pending=Math.max(0,base.length-done.size),kind=mode==='actions'?'ação':mode==='tasks'?'tarefa':'unidade';return `<section class="slide ${complete?'isDone':''}" data-i="${i}"><div class="zone topz">${i?'↑ anterior':''}</div><div class="focus"><div class="eyebrow"><span class="index">${String(i+1).padStart(2,'0')} / ${String(a.length).padStart(2,'0')}</span><span>${complete?'Concluído':'Próxima '+kind}</span></div><h1 class="title">${esc(it.title)}</h1><div class="meta"><div class="pending">${complete?'✓ concluído':'↓ '+pending+' pendente'+(pending===1?'':'s')}</div><div class="trail">${esc(hierarchy(it))}</div></div><div class="hint">Duplo toque para contexto · ${scrollCompletes&&(mode==='tasks'||mode==='actions')?'deslize para concluir e avançar':'deslize para navegar'}</div><div class="detail"><p>${esc(it.context)}</p><textarea data-note="${esc(it.id)}" placeholder="Adicionar nota de execução...">${esc(notes[it.id]||'')}</textarea></div></div><div class="zone botz">${i<a.length-1?'próxima ↓':''}</div></section>`}).join('');sc.querySelectorAll('textarea').forEach(x=>x.addEventListener('input',e=>{notes[e.target.dataset.note]=e.target.value;save()}));requestAnimationFrame(()=>go(index,false));ui()}function syncDone(){const a=items();sc.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('isDone',!!a[i]&&isDone(a[i])))}function ui(){const a=items(),it=a[index]||a[0],pending=Math.max(0,base.length-done.size),progress=(base.length-pending)/base.length*100,d=isDone(it);$('progressBar').style.width=progress+'%';$('auto').setAttribute('aria-pressed',String(auto));$('completeOnScroll').setAttribute('aria-pressed',String(scrollCompletes));document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));[$('doneTop'),$('doneMobile')].forEach(b=>{b.classList.toggle('done',d);b.textContent=d?'Reabrir':b.id==='doneMobile'?'Concluir '+(mode==='tasks'?'tarefa':'unidade'):'Concluir'});$('timer').textContent=fmt(remaining);$('timerState').textContent=running?'ativo':status;$('duration').value=String(duration);save()}function go(n,smooth=true){const a=items();index=Math.max(0,Math.min(n,a.length-1));programmaticUntil=smooth?Date.now()+1200:0;sc.querySelector(`[data-i="${index}"]`)?.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'});ui()}function toggleDone(){const a=items(),it=a[index],was=isDone(it);ids(it).forEach(id=>was?done.delete(id):done.add(id));syncDone();ui();say(was?'Unidade reaberta':'Unidade concluída');if(!was&&index<a.length-1)setTimeout(()=>go(index+1),180)}function detail(){sc.querySelector(`[data-i="${index}"] .detail`)?.classList.toggle('open')}function fmt(s){s=Math.max(0,Math.ceil(s));return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function stop(s='pronto'){running=false;status=s;if(tick){clearInterval(tick);tick=null}ui()}function timerToggle(){if(running){stop('pausado');return}if(remaining<=0)remaining=duration;running=true;status='ativo';lastTick=Date.now();tick=setInterval(()=>{const now=Date.now();remaining-=Math.max(0,(now-lastTick)/1000);lastTick=now;if(remaining<=0){remaining=0;if(auto&&index<items().length-1){go(index+1);remaining=duration;lastTick=Date.now();say('Auto Mode · próxima unidade')}else stop(index>=items().length-1?'ciclo finalizado':'tempo concluído')}ui()},250);ui()}let toastTimer;function say(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1450)}function settle(){const a=items(),next=Math.max(0,Math.min(Math.round(sc.scrollTop/sc.clientHeight),a.length-1));if(next===index)return;const prev=index,manual=Date.now()>programmaticUntil;if(manual&&scrollCompletes&&(mode==='tasks'||mode==='actions')&&next>prev){const prior=a[prev],was=isDone(prior);ids(prior).forEach(id=>done.add(id));syncDone();if(!was)say('Concluído pelo scroll')}index=next;ui()}$('timerToggle').onclick=timerToggle;$('auto').onclick=()=>{auto=!auto;ui();say(auto?'Auto Mode ativado':'Auto Mode desativado')};$('context').onclick=detail;$('doneTop').onclick=$('doneMobile').onclick=toggleDone;$('completeOnScroll').onclick=()=>{scrollCompletes=!scrollCompletes;render();say(scrollCompletes?'Scroll conclui ao avançar':'Scroll apenas navega')};$('more').onclick=()=>{const o=$('menu').classList.toggle('open');$('more').setAttribute('aria-expanded',String(o))};document.addEventListener('click',e=>{if(!$('menu').contains(e.target)&&!$('more').contains(e.target)){$('menu').classList.remove('open');$('more').setAttribute('aria-expanded','false')}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;index=0;$('menu').classList.remove('open');render()});$('duration').onchange=e=>{duration=+e.target.value;remaining=duration;stop()};$('resetTimer').onclick=()=>{remaining=duration;stop();say('Timer reiniciado')};$('resetProgress').onclick=()=>{done.clear();syncDone();ui();say('Conclusões limpas')};sc.addEventListener('scroll',()=>{clearTimeout(settleTimer);settleTimer=setTimeout(settle,150)},{passive:true});if('onscrollend'in sc)sc.addEventListener('scrollend',settle);sc.addEventListener('pointerup',e=>{if(e.target.closest('textarea,button,select'))return;const now=Date.now();if(now-lastTap<330){detail();lastTap=0}else lastTap=now});document.addEventListener('keydown',e=>{if(['TEXTAREA','SELECT','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();go(index+1)}else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(index-1)}else if(e.key===' '){e.preventDefault();timerToggle()}else if(e.key==='Enter'){e.preventDefault();toggleDone()}else if(e.key==='Escape'){$('menu').classList.remove('open');$('more').setAttribute('aria-expanded','false')}});render()})();</script></body></html>
