<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Executar — Scroll Task Prototype</title>
<style>
:root{--bg:#f3f2ed;--panel:#fff;--ink:#11120f;--muted:#71736d;--line:#d9d9d2;--accent:#d7ff4b;--soft:#f7f7f2;--radius:24px}
*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100%;padding:24px}button,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible,.phone:focus-visible{outline:3px solid #111;outline-offset:2px}
.shell{max-width:430px;margin:0 auto}.meta{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:0 4px 12px;color:var(--muted);font-size:12px}.phone{position:relative;height:700px;background:var(--panel);border:1px solid var(--line);border-radius:34px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.08)}
.topbar{position:absolute;left:0;right:0;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 14px 12px}.toprow{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center}.iconbtn{width:46px;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--soft);font-size:23px;line-height:1}.project{min-width:0}.project strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.count{min-width:58px;border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center}.count b{display:block;font-size:18px}.count small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.menu{display:none;margin-top:10px;padding:8px;background:var(--soft);border:1px solid var(--line);border-radius:14px}.menu.open{display:grid;grid-template-columns:1fr 1fr;gap:6px}.menu button{border:0;background:transparent;text-align:left;padding:10px;border-radius:9px}.menu button.active,.menu button:hover{background:#fff}
.scroller{position:absolute;left:0;right:0;top:86px;bottom:0;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y}.scroller::-webkit-scrollbar{display:none}.slide{height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-rows:1fr auto 1fr;padding:18px 20px;position:relative}.zoneTop{display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;color:var(--muted);font-size:11px}.zoneMid{display:flex;align-items:center;justify-content:center}.zoneBottom{display:flex;align-items:flex-start;justify-content:center;padding-top:18px;color:var(--muted);font-size:11px}.actionWrap{width:100%;text-align:center}.eyebrow{font-size:11px;color:var(--muted);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.index{font-size:12px;color:var(--muted);margin-bottom:8px}.actionCard{width:100%;min-height:180px;border:1px solid var(--line);background:#fff;border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .2s,transform .2s}.actionTitle{font-size:30px;font-weight:730;letter-spacing:-.04em;line-height:1.05}.gestureHint{margin-top:12px;font-size:11px;color:var(--muted)}.detail{display:none;width:100%;margin-top:12px;text-align:left;border-top:1px solid var(--line);padding-top:12px}.detail.open{display:block}.detail p{font-size:13px;line-height:1.4;margin:0}.detail label{display:block;font-size:11px;color:var(--muted);margin-top:12px}.detail textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:10px;resize:none;min-height:64px}.completed{opacity:.42}.completed .actionTitle{text-decoration:line-through}.current .actionCard{transform:scale(1)}
.controls{margin-top:12px;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:14px}.controlgrid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.controls label{font-size:11px;color:var(--muted)}.controls select{display:block;width:100%;min-height:44px;margin-top:5px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 10px}.timer{text-align:right}.timer b{font:700 28px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.timer span{display:block;font-size:11px;color:var(--muted);margin-top:6px}.controlBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{min-height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 15px}.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.btn.ghost{background:var(--soft)}.switch{display:flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--line);border-radius:13px;padding:0 12px;font-size:13px;color:var(--ink)!important}.switch input{width:18px;height:18px}.notice{font-size:10px;line-height:1.4;color:var(--muted);margin:10px 2px 0}.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:0 4px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:5px}
@media(prefers-reduced-motion:reduce){.scroller{scroll-behavior:auto}.actionCard{transition:none}}@media(max-width:390px){body{padding:10px}.phone{height:650px;border-radius:26px}.actionTitle{font-size:27px}.topbar{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<main class="shell" id="app">
  <div class="meta"><span>Executar · Scroll Task</span><span id="modeLabel">Tarefa por tarefa</span></div>
  <section class="phone" id="phone" tabindex="0" aria-label="Modo Scroll Task. Role verticalmente para mudar de tarefa.">
    <header class="topbar">
      <div class="toprow">
        <button class="iconbtn" id="menuBtn" type="button" aria-label="Escolher granularidade" aria-expanded="false">⋮</button>
        <div class="project"><strong id="projectName">Lançamento do MVP</strong><span id="progress">1 de 30 tarefas</span></div>
        <div class="count"><b id="pending">30</b><small>pendentes</small></div>
      </div>
      <div class="menu" id="menu" role="menu">
        <button type="button" data-mode="actions">Ação por ação</button>
        <button type="button" data-mode="tasks" class="active">Tarefa por tarefa</button>
        <button type="button" data-mode="phases">Fase por fase</button>
        <button type="button" data-mode="workflows">Workflow por workflow</button>
      </div>
    </header>
    <div class="scroller" id="scroller" aria-live="polite"></div>
  </section>

  <section class="controls" aria-label="Controles do modo de execução">
    <div class="controlgrid">
      <label>Tempo previsto
        <select id="duration">
          <option value="900">15 minutos</option>
          <option value="1800" selected>30 minutos</option>
          <option value="2700">45 minutos</option>
          <option value="10">10 segundos · demo</option>
        </select>
      </label>
      <div class="timer"><b id="timer">30:00</b><span id="timerStatus" aria-live="polite">pronto</span></div>
    </div>
    <div class="controlBtns">
      <button class="btn ghost" id="prev" type="button">Anterior</button>
      <button class="btn primary" id="start" type="button">Iniciar</button>
      <button class="btn" id="complete" type="button">Concluir</button>
      <button class="btn" id="next" type="button">Próxima</button>
      <button class="btn" id="reset" type="button">Reiniciar</button>
      <label class="switch"><input id="autoScroll" type="checkbox" /> Auto-scroll</label>
    </div>
    <p class="notice">Scroll vertical nativo + snap: cada gesto avança para uma unidade de execução. O Auto-scroll avança ao fim do timer sem marcar a tarefa como concluída.</p>
  </section>
  <div class="statusbar"><span><span class="dot"></span>Role / arraste verticalmente</span><span id="stateText">READY · 01/30</span></div>
</main>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const base=[
    {title:'Definir objetivo',task:'Direcionamento do produto',phase:'Descoberta',workflow:'Estratégia',context:'Defina em uma frase o resultado que este ciclo precisa produzir.'},
    {title:'Validar entregável',task:'Direcionamento do produto',phase:'Descoberta',workflow:'Estratégia',context:'Confirme qual evidência concreta representará o trabalho concluído.'},
    {title:'Registrar restrições',task:'Direcionamento do produto',phase:'Descoberta',workflow:'Estratégia',context:'Liste prazo, orçamento, dependências e limites relevantes.'},
    {title:'Mapear usuários',task:'Entendimento do usuário',phase:'Descoberta',workflow:'Estratégia',context:'Identifique os perfis prioritários e seus contextos de uso.'},
    {title:'Listar necessidades',task:'Entendimento do usuário',phase:'Descoberta',workflow:'Estratégia',context:'Registre as necessidades operacionais que o produto precisa atender.'},
    {title:'Priorizar problemas',task:'Entendimento do usuário',phase:'Descoberta',workflow:'Estratégia',context:'Ordene os problemas pelo impacto na execução do usuário.'},
    {title:'Definir escopo',task:'Planejamento do ciclo',phase:'Planejamento',workflow:'Estratégia',context:'Delimite o que entra e o que não entra neste ciclo.'},
    {title:'Quebrar entregáveis',task:'Planejamento do ciclo',phase:'Planejamento',workflow:'Estratégia',context:'Decomponha os entregáveis em unidades pequenas e verificáveis.'},
    {title:'Ordenar dependências',task:'Planejamento do ciclo',phase:'Planejamento',workflow:'Estratégia',context:'Sequencie o trabalho respeitando as dependências identificadas.'},
    {title:'Estimar esforço',task:'Planejamento operacional',phase:'Planejamento',workflow:'Estratégia',context:'Atribua uma estimativa simples de esforço às unidades do ciclo.'},
    {title:'Definir responsáveis',task:'Planejamento operacional',phase:'Planejamento',workflow:'Estratégia',context:'Associe cada entrega a um responsável claro.'},
    {title:'Confirmar critérios',task:'Planejamento operacional',phase:'Planejamento',workflow:'Estratégia',context:'Defina os critérios mínimos para considerar cada entrega aceita.'},
    {title:'Preparar ambiente',task:'Preparação da execução',phase:'Execução',workflow:'Produção',context:'Abra ferramentas, arquivos e referências necessários para executar.'},
    {title:'Reunir referências',task:'Preparação da execução',phase:'Execução',workflow:'Produção',context:'Centralize as fontes que serão utilizadas durante a execução.'},
    {title:'Eliminar bloqueios',task:'Preparação da execução',phase:'Execução',workflow:'Produção',context:'Resolva bloqueios conhecidos antes de iniciar o trabalho principal.'},
    {title:'Produzir primeira versão',task:'Construção da entrega',phase:'Execução',workflow:'Produção',context:'Crie a primeira versão funcional do entregável prioritário.'},
    {title:'Revisar consistência',task:'Construção da entrega',phase:'Execução',workflow:'Produção',context:'Verifique coerência, completude e alinhamento com o objetivo.'},
    {title:'Ajustar entrega',task:'Construção da entrega',phase:'Execução',workflow:'Produção',context:'Faça os ajustes necessários antes da validação formal.'},
    {title:'Executar teste',task:'Validação interna',phase:'Validação',workflow:'Produção',context:'Teste o entregável contra os critérios de aceite definidos.'},
    {title:'Registrar falhas',task:'Validação interna',phase:'Validação',workflow:'Produção',context:'Registre problemas encontrados sem interromper o fluxo principal.'},
    {title:'Corrigir falhas',task:'Validação interna',phase:'Validação',workflow:'Produção',context:'Corrija somente as falhas que impedem o critério de aceite.'},
    {title:'Preparar apresentação',task:'Aprovação',phase:'Validação',workflow:'Entrega',context:'Organize o material necessário para uma validação objetiva.'},
    {title:'Solicitar aprovação',task:'Aprovação',phase:'Validação',workflow:'Entrega',context:'Encaminhe a entrega ao responsável pela aprovação.'},
    {title:'Incorporar retorno',task:'Aprovação',phase:'Validação',workflow:'Entrega',context:'Transforme feedback aprovado em ajustes claros e rastreáveis.'},
    {title:'Finalizar artefatos',task:'Fechamento',phase:'Entrega',workflow:'Entrega',context:'Consolide os arquivos e versões finais do ciclo.'},
    {title:'Registrar decisão',task:'Fechamento',phase:'Entrega',workflow:'Entrega',context:'Documente decisões relevantes tomadas durante o ciclo.'},
    {title:'Atualizar status',task:'Fechamento',phase:'Entrega',workflow:'Entrega',context:'Atualize o estado das entregas e pendências restantes.'},
    {title:'Publicar entrega',task:'Encerramento',phase:'Entrega',workflow:'Entrega',context:'Disponibilize a versão final no canal ou ambiente definido.'},
    {title:'Revisar pendências',task:'Encerramento',phase:'Entrega',workflow:'Entrega',context:'Confirme quais itens permanecerão para o próximo ciclo.'},
    {title:'Encerrar ciclo',task:'Encerramento',phase:'Entrega',workflow:'Entrega',context:'Registre a conclusão do ciclo e o próximo ponto de continuidade.'}
  ];

  const unique=(key,label)=>[...new Map(base.map(x=>[x[key],{title:x[key],context:`Execute e conclua o conjunto de itens de ${label.toLowerCase()}: ${x[key]}.`}])).values()];
  const data={
    actions:base.map(x=>({...x})),
    tasks:base.map(x=>({...x})),
    phases:unique('phase','Fase'),
    workflows:unique('workflow','Workflow')
  };
  const labels={actions:'Ação por ação',tasks:'Tarefa por tarefa',phases:'Fase por fase',workflows:'Workflow por workflow'};
  const nouns={actions:'ações',tasks:'tarefas',phases:'fases',workflows:'workflows'};
  let mode='tasks',index=0,completed=new Set(),remaining=1800,running=false,ticker=null,scrollRAF=null;

  function key(i=index){return `${mode}:${i}`}
  function currentItems(){return data[mode]}
  function itemMeta(item){
    if(mode==='workflows') return 'Workflow do projeto';
    if(mode==='phases') return 'Fase do projeto';
    return `${item.workflow} · ${item.phase} · ${item.task}`;
  }
  function renderSlides(){
    const scroller=$('scroller');
    scroller.innerHTML=currentItems().map((item,i)=>`<section class="slide${i===index?' current':''}" data-index="${i}"><div class="zoneTop">${i===0?'início do ciclo':'↑ anterior'}</div><div class="zoneMid"><div class="actionWrap"><div class="eyebrow">${itemMeta(item)}</div><div class="index">${String(i+1).padStart(2,'0')}</div><button class="actionCard${completed.has(`${mode}:${i}`)?' completed':''}" type="button" data-card="${i}" aria-label="${item.title}. Duplo toque para contexto"><span class="actionTitle">${item.title}</span><span class="gestureHint">duplo toque para contexto</span><div class="detail" data-detail="${i}"><p>${item.context}</p><label>Nota rápida<textarea data-note="${i}" placeholder="Adicionar contexto..."></textarea></label></div></button></div></div><div class="zoneBottom">${i===currentItems().length-1?'fim do ciclo':'próxima ↓'}</div></section>`).join('');
    scroller.querySelectorAll('[data-card]').forEach(card=>{
      card.addEventListener('dblclick',e=>{e.preventDefault();toggleDetail(Number(card.dataset.card))});
      let lastTap=0,startY=0;
      card.addEventListener('pointerdown',e=>{startY=e.clientY});
      card.addEventListener('pointerup',e=>{const now=Date.now();if(Math.abs(e.clientY-startY)<10&&now-lastTap<330){toggleDetail(Number(card.dataset.card));lastTap=0}else lastTap=now});
    });
    scroller.querySelectorAll('[data-note]').forEach(area=>area.addEventListener('input',e=>{currentItems()[Number(area.dataset.note)].note=e.target.value}));
    restoreNotes();
    updateHeader();
  }
  function restoreNotes(){ $('scroller').querySelectorAll('[data-note]').forEach(area=>{area.value=currentItems()[Number(area.dataset.note)].note||''}) }
  function toggleDetail(i){ const d=$('scroller').querySelector(`[data-detail="${i}"]`); if(d)d.classList.toggle('open') }
  function updateHeader(){
    const items=currentItems();
    $('modeLabel').textContent=labels[mode];$('progress').textContent=`${index+1} de ${items.length} ${nouns[mode]}`;
    const done=[...completed].filter(k=>k.startsWith(mode+':')).length;$('pending').textContent=String(items.length-done);
    $('stateText').textContent=`${running?'RUNNING':'READY'} · ${String(index+1).padStart(2,'0')}/${String(items.length).padStart(2,'0')}`;
    $('scroller').querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('current',i===index));
  }
  function syncIndexFromScroll(){
    if(scrollRAF)cancelAnimationFrame(scrollRAF);
    scrollRAF=requestAnimationFrame(()=>{
      const s=$('scroller');const h=s.clientHeight||1;const next=Math.max(0,Math.min(currentItems().length-1,Math.round(s.scrollTop/h)));
      if(next!==index){index=next;updateHeader()}
    });
  }
  function goTo(i,behavior='smooth'){
    const max=currentItems().length-1;index=Math.max(0,Math.min(max,i));
    const s=$('scroller');s.scrollTo({top:index*s.clientHeight,behavior});updateHeader();
  }
  function complete(){const k=key();completed.has(k)?completed.delete(k):completed.add(k);const card=$('scroller').querySelector(`[data-card="${index}"]`);if(card)card.classList.toggle('completed',completed.has(k));updateHeader()}
  function fmt(sec){sec=Math.max(0,Math.round(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
  function renderTimer(){$('timer').textContent=fmt(remaining)}
  function stop(status='pausado'){running=false;if(ticker){clearInterval(ticker);ticker=null}$('start').textContent='Iniciar';$('timerStatus').textContent=status;updateHeader()}
  function reset(){stop('pronto');remaining=Number($('duration').value)||1800;renderTimer()}
  function start(){
    if(running){stop();return}if(remaining<=0)remaining=Number($('duration').value)||1800;running=true;$('start').textContent='Pausar';$('timerStatus').textContent='executando';updateHeader();
    let prev=Date.now();ticker=setInterval(()=>{const now=Date.now();remaining-=Math.max(0,(now-prev)/1000);prev=now;if(remaining<=0){remaining=0;renderTimer();if($('autoScroll').checked){if(index<currentItems().length-1)goTo(index+1);remaining=Number($('duration').value)||1800;$('timerStatus').textContent='auto-scroll → próximo'}else stop('tempo concluído')}renderTimer()},250)
  }
  function switchMode(next){mode=next;index=0;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('menu').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false');renderSlides();$('scroller').scrollTop=0;reset()}

  $('menuBtn').addEventListener('click',()=>{const open=$('menu').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',String(open))});
  document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>switchMode(btn.dataset.mode)));
  $('scroller').addEventListener('scroll',syncIndexFromScroll,{passive:true});
  $('prev').addEventListener('click',()=>goTo(index-1));$('next').addEventListener('click',()=>goTo(index+1));$('complete').addEventListener('click',complete);
  $('duration').addEventListener('change',reset);$('start').addEventListener('click',start);$('reset').addEventListener('click',reset);
  $('phone').addEventListener('keydown',e=>{if(['TEXTAREA','SELECT','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowDown'){e.preventDefault();goTo(index+1)}if(e.key==='ArrowUp'){e.preventDefault();goTo(index-1)}if(e.key==='Enter'){e.preventDefault();complete()}});
  window.addEventListener('resize',()=>goTo(index,'auto'));
  renderSlides();renderTimer();
})();
</script>
</body>
</html>
