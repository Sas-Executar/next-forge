<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Executar — Modo de Execução</title><style>
:root{--fg:#111;--mut:#737373;--line:#e7e7e7;--soft:#f7f7f7;--acc:#d9ff57;--top:72px;--bottom:0px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:var(--fg);font-family:Geist,"Geist Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.tap{min-width:44px;min-height:44px}button:focus-visible,select:focus-visible,textarea:focus-visible,.scroller:focus-visible{outline:2px solid #111;outline-offset:2px}.top{position:fixed;inset:0 0 auto;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 20px 0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(18px);z-index:40}.bar{height:var(--top);max-width:1600px;margin:auto;display:grid;grid-template-columns:1fr minmax(260px,620px) 1fr;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:650}.mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#111;color:#fff;font-weight:800}.project{text-align:center;min-width:0}.project b,.project span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project b{font-size:14px}.project span{font-size:12px;color:var(--mut);margin-top:4px}.cmds{display:flex;justify-content:flex-end;align-items:center;gap:8px;position:relative}.cmd,.primary{height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px}.cmd:hover{background:var(--soft)}.primary{background:#111;border-color:#111;color:#fff;font-weight:650;padding-inline:16px}.primary.done{background:var(--acc);border-color:var(--acc);color:#111}.auto[aria-pressed=true]{background:#111;border-color:#111;color:#fff}.lamp{width:8px;height:8px;border-radius:50%;background:#bbb}.auto[aria-pressed=true] .lamp{background:var(--acc);box-shadow:0 0 0 3px #d9ff5730}.timer{font:650 18px/1 ui-monospace,Menlo,monospace}.state{font-size:11px;color:var(--mut)}.menu{display:none;position:absolute;right:0;top:52px;width:286px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0002}.menu.open{display:block}.menu small{display:block;color:var(--mut);padding:8px 10px 4px}.menu button,.menu select{width:100%;min-height:44px;border:0;border-radius:9px;background:transparent;text-align:left;padding:0 10px;font-size:13px}.menu button:hover,.menu button.active{background:var(--soft)}.menu select{border:1px solid var(--line);background:#fff}.hr{height:1px;background:var(--line);margin:5px 8px}.main{position:fixed;inset:calc(var(--top) + env(safe-area-inset-top)) 0 var(--bottom)}.scroller{width:100%;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;-webkit-overflow-scrolling:touch}.scroller::-webkit-scrollbar{display:none}.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-rows:1fr auto 1fr;padding:20px clamp(20px,7vw,128px)}.zone{display:flex;justify-content:center;color:#aaa;font-size:11px}.topz{align-items:flex-end;padding-bottom:26px}.botz{align-items:flex-start;padding-top:26px}.focus{width:min(920px,100%);margin:auto;text-align:center}.trail{font-size:12px;color:var(--mut);margin-bottom:14px}.num{font:500 12px/1.2 ui-monospace,Menlo,monospace;color:#aaa;margin-bottom:16px}.title{margin:0;font-size:clamp(40px,6vw,82px);font-weight:640;letter-spacing:-.055em;line-height:.98;text-wrap:balance}.hint{margin-top:16px;font-size:12px;color:#aaa}.detail{display:none;width:min(640px,100%);margin:24px auto 0;padding:18px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--soft)}.detail.open{display:block}.detail p{margin:0 0 12px;font-size:14px;line-height:1.55}.detail textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px}.isDone .title{text-decoration:line-through;color:#999}.hud{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:#fffffff2;backdrop-filter:blur(12px)}.prog{width:110px;height:4px;border-radius:99px;background:#eee;overflow:hidden}.prog i{display:block;height:100%;background:#111}.count{text-align:right}.count b{display:block;font-size:13px}.count span{display:block;font-size:10px;color:var(--mut);margin-top:2px}.mobile{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;z-index:80;background:#111;color:#fff;border-radius:9px;padding:9px 12px;font-size:12px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1080px){.bar{grid-template-columns:auto minmax(210px,1fr) auto}.brand span,.ctxText,.autoText,.state{display:none}.project{text-align:left}.cmds{gap:6px}}
@media(max-width:720px){:root{--top:116px;--bottom:76px}.top{padding-left:14px;padding-right:14px}.bar{height:var(--top);grid-template-columns:1fr auto;grid-template-rows:56px 60px;gap:0 8px}.brand{grid-column:1;grid-row:1}.cmds{grid-column:2;grid-row:1}.project{grid-column:1/3;grid-row:2;border-top:1px solid var(--line);padding-top:10px}.desktopPrimary{display:none}.mobile{display:flex;position:fixed;inset:auto 0 0;height:calc(var(--bottom) + env(safe-area-inset-bottom));padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:35;border-top:1px solid var(--line);background:#fffffff7;backdrop-filter:blur(16px)}.mobile .primary{width:100%;height:52px}.hud{right:12px;bottom:calc(var(--bottom) + 12px)}.prog{width:72px}.slide{padding-left:22px;padding-right:22px}.title{font-size:clamp(38px,11vw,64px)}.toast{bottom:calc(var(--bottom) + env(safe-area-inset-bottom) + 16px)}}

</style></head><body><header class="top"><div class="bar"><div class="brand"><div class="mark">E</div><span>Executar</span></div><div class="project"><b>Lançamento do MVP</b><span id="crumb">Estratégia · Descoberta · 1 de 30 tarefas</span></div><div class="cmds"><div class="cmd"><span class="timer" id="timer">30:00</span><span class="state" id="timerState">pronto</span></div><button class="cmd auto tap" id="auto" aria-pressed="false"><span class="lamp"></span><span class="autoText">Auto</span></button><button class="cmd ctx tap" id="context"><span>＋</span><span class="ctxText">Contexto</span></button><button class="primary desktopPrimary tap" id="doneTop">Concluir</button><button class="cmd tap" id="more" aria-expanded="false">•••</button><div class="menu" id="menu"><small>Granularidade</small><button data-mode="actions">Ação por ação</button><button data-mode="tasks" class="active">Tarefa por tarefa</button><button data-mode="phases">Fase por fase</button><button data-mode="workflows">Workflow por workflow</button><div class="hr"></div><small>Tempo previsto</small><select id="duration"><option value="900">15 minutos</option><option value="1800">30 minutos</option><option value="2700">45 minutos</option><option value="10">10 segundos · demo</option></select><div class="hr"></div><button id="timerBtn">Iniciar timer</button><button id="resetTimer">Reiniciar timer</button><button id="resetProgress">Limpar conclusões</button></div></div></div></header><main class="main"><div class="scroller" id="scroller" tabindex="0"></div></main><div class="hud"><div class="prog"><i id="bar"></i></div><div class="count"><b id="pending">30 pendentes</b><span id="pos">01 / 30</span></div></div><div class="mobile"><button class="primary tap" id="doneMobile">Concluir tarefa</button></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
(()=>{const titles=['Definir objetivo','Validar entregável','Registrar restrições','Mapear usuários','Listar necessidades','Priorizar problemas','Definir escopo','Quebrar entregáveis','Ordenar dependências','Estimar esforço','Definir responsáveis','Confirmar critérios','Preparar ambiente','Reunir referências','Eliminar bloqueios','Produzir primeira versão','Revisar consistência','Ajustar entrega','Executar teste','Registrar falhas','Corrigir falhas','Preparar apresentação','Solicitar aprovação','Incorporar retorno','Finalizar artefatos','Registrar decisão','Atualizar status','Publicar entrega','Revisar pendências','Encerrar ciclo'];const groups=['Direcionamento do produto','Entendimento do usuário','Planejamento do ciclo','Planejamento operacional','Preparação da execução','Construção da entrega','Validação interna','Aprovação','Fechamento','Encerramento'];const phase=i=>i<6?'Descoberta':i<12?'Planejamento':i<21?'Execução/Validação':'Entrega';const workflow=i=>i<12?'Estratégia':i<21?'Produção':'Entrega';const base=titles.map((title,i)=>({id:'t'+(i+1),title,task:groups[Math.floor(i/3)],phase:phase(i),workflow:workflow(i),context:`Execute “${title}” dentro de ${groups[Math.floor(i/3)]}. Mantenha apenas o contexto necessário para concluir esta unidade.`}));const $=id=>document.getElementById(id),S='executar-scroll-v5',sc=$('scroller');let saved={};try{saved=JSON.parse(localStorage.getItem(S)||'{}')}catch{}let mode=saved.mode||'tasks',index=+saved.index||0,done=new Set(saved.done||[]),notes=saved.notes||{},auto=!!saved.auto,duration=+saved.duration||1800,remaining=Number.isFinite(+saved.remaining)?+saved.remaining:duration,running=false,tick=null,last=0,status='pronto';const modes={actions:'Ação por ação',tasks:'Tarefa por tarefa',phases:'Fase por fase',workflows:'Workflow por workflow'},nouns={actions:'ações',tasks:'tarefas',phases:'fases',workflows:'workflows'};function items(){if(mode==='tasks'||mode==='actions')return base;const key=mode==='phases'?'phase':'workflow',m=new Map;for(const t of base){if(!m.has(t[key]))m.set(t[key],{id:key+t[key],title:t[key],context:`Execute as tarefas pertencentes a ${t[key]}.`,members:[]});m.get(t[key]).members.push(t.id)}return[...m.values()]}function ids(it){return it.members||[it.id]}function isDone(it){return ids(it).every(id=>done.has(id))}function save(){localStorage.setItem(S,JSON.stringify({mode,index,done:[...done],notes,auto,duration,remaining}))}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function trail(it){return mode==='tasks'||mode==='actions'?`${it.workflow} · ${it.phase} · ${it.task}`:modes[mode]}function render(){const a=items();index=Math.max(0,Math.min(index,a.length-1));sc.innerHTML=a.map((it,i)=>`<section class="slide ${isDone(it)?'isDone':''}" data-i="${i}"><div class="zone topz">${i?'↑ anterior':''}</div><div class="focus"><div class="trail">${esc(trail(it))}</div><div class="num">${String(i+1).padStart(2,'0')}</div><h1 class="title">${esc(it.title)}</h1><div class="hint">Duplo toque para contexto</div><div class="detail"><p>${esc(it.context)}</p><textarea data-note="${esc(it.id)}" placeholder="Adicionar nota...">${esc(notes[it.id]||'')}</textarea></div></div><div class="zone botz">${i<a.length-1?'próxima ↓':''}</div></section>`).join('');sc.querySelectorAll('textarea').forEach(x=>x.oninput=e=>{notes[e.target.dataset.note]=e.target.value;save()});requestAnimationFrame(()=>go(index,false));ui()}function ui(){const a=items(),it=a[index]||a[0],p=base.length-done.size;$('crumb').textContent=mode==='tasks'||mode==='actions'?`${it.workflow} · ${it.phase} · ${index+1} de ${a.length} ${nouns[mode]}`:`${modes[mode]} · ${index+1} de ${a.length}`;$('pending').textContent=`${p} pendente${p===1?'':'s'}`;$('pos').textContent=`${String(index+1).padStart(2,'0')} / ${String(a.length).padStart(2,'0')}`;$('bar').style.width=`${(base.length-p)/base.length*100}%`;$('auto').setAttribute('aria-pressed',auto);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const d=isDone(it);[$('doneTop'),$('doneMobile')].forEach(b=>{b.classList.toggle('done',d);b.textContent=d?'Reabrir':b.id==='doneMobile'&&mode==='tasks'?'Concluir tarefa':'Concluir'});$('timer').textContent=fmt(remaining);$('timerState').textContent=running?'em execução':status;$('timerBtn').textContent=running?'Pausar timer':'Iniciar timer';$('duration').value=duration;save()}function go(n,smooth=true){const a=items();index=Math.max(0,Math.min(n,a.length-1));sc.querySelector(`[data-i="${index}"]`)?.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'});ui()}function toggleDone(){const a=items(),it=a[index],all=isDone(it);ids(it).forEach(id=>all?done.delete(id):done.add(id));render();say(all?'Reaberto':'Concluído');if(!all&&index<items().length-1)setTimeout(()=>go(index+1),120)}function detail(){sc.querySelector(`[data-i="${index}"] .detail`)?.classList.toggle('open')}function fmt(s){s=Math.max(0,Math.ceil(s));return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function start(){if(running){stop('pausado');return}if(remaining<=0)remaining=duration;running=true;status='em execução';last=Date.now();tick=setInterval(()=>{const now=Date.now();remaining-=Math.max(0,(now-last)/1000);last=now;if(remaining<=0){remaining=0;if(auto&&index<items().length-1){go(index+1);remaining=duration;last=Date.now();say('Auto · próxima unidade')}else stop(index>=items().length-1?'ciclo finalizado':'tempo concluído')}ui()},250);ui()}function stop(s='pronto'){running=false;status=s;if(tick){clearInterval(tick);tick=null}ui()}let tt;function say(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),1300)}$('auto').onclick=()=>{auto=!auto;ui();say(auto?'Auto Mode ativado':'Auto Mode desativado')};$('context').onclick=detail;$('doneTop').onclick=$('doneMobile').onclick=toggleDone;$('more').onclick=()=>{const o=$('menu').classList.toggle('open');$('more').setAttribute('aria-expanded',o)};document.onclick=e=>{if(!$('menu').contains(e.target)&&!$('more').contains(e.target))$('menu').classList.remove('open')};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;index=0;$('menu').classList.remove('open');render()});$('duration').onchange=e=>{duration=+e.target.value;remaining=duration;stop()};$('timerBtn').onclick=start;$('resetTimer').onclick=()=>{remaining=duration;stop()};$('resetProgress').onclick=()=>{done.clear();render();say('Conclusões limpas')};let raf=0;sc.onscroll=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const n=Math.round(sc.scrollTop/sc.clientHeight);if(n!==index){index=Math.max(0,Math.min(n,items().length-1));ui()}})};sc.ondblclick=e=>{if(!e.target.closest('textarea'))detail()};document.onkeydown=e=>{if(['TEXTAREA','SELECT','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();go(index+1)}else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(index-1)}else if(e.key===' '){e.preventDefault();start()}else if(e.key==='Enter'){e.preventDefault();toggleDone()}else if(e.key==='Escape')$('menu').classList.remove('open')};render()})();
</script></body></html>
